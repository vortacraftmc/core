plugins {
	// Pinned to match the version used elsewhere in vortacraftmc/core
	// (mods/datapack-blocker, examples/itemExampleMod). 1.15.5 is also the
	// minimum Loom version with unobfuscated-jar support (needed for MC 26.x,
	// which ships without Yarn mappings) via MinecraftJarProcessor.isUnobfuscated().
	id 'fabric-loom' version '1.15.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// MC 26.3 ships unobfuscated (final names, no Yarn layer needed).
	// fabric.loom.disableObfuscation=true in gradle.properties tells Loom to
	// skip mapping resolution entirely — there is no `mappings "..."` line.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. NOTE: with disableObfuscation=true, Loom's
	// RemapConfigurations.setupForSourceSet returns early and never creates
	// the mod* configurations — so this must be plain `implementation`,
	// not `modImplementation`, or dependency resolution will fail/no-op.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Java 25 is required by Minecraft 26.3
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	withSourcesJar()
}

// NOTE: no `jar { from("LICENSE") {...} }` block here -- add one back only
// if you add a LICENSE file to this subproject; referencing a nonexistent
// file here would fail the jar task.

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
