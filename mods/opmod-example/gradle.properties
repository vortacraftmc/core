# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5

# MC 26.x ships unobfuscated (final names baked in, no Yarn mapping layer
# exists to resolve). This tells Loom (>=1.15.5) to skip mapping resolution
# entirely instead of trying to fetch net.fabricmc:yarn:26.3+build.X, which
# does not exist and would fail resolution.
fabric.loom.disableObfuscation=true

# Fabric API
# IMPORTANT: this project pins Fabric Loom to 1.15.5 to match the rest of
# vortacraftmc/core (mods/datapack-blocker, examples/itemExampleMod). Confirm
# a Fabric API build published against MC 26.3 is actually compatible with
# Loom 1.15.5 before relying on this -- check
# https://modrinth.com/mod/fabric-api/versions and pick a "26.3" build whose
# publish date is close to when Loom 1.15.5 / Gradle 9 support for 26.x
# landed. If none is compatible, Loom needs bumping past 1.15.5 for this
# subproject specifically (see README).
fabric_version=0.161.0+26.3

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=opmod
