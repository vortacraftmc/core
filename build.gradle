// =============================================================================
// vortacraftmc/core - root build.gradle
//
// This file only defines cross-cutting tasks that operate across the whole
// monorepo (packs/, mods/, examples/). Per-subproject build logic lives in
// each subproject's own build.gradle - this file never configures a
// subproject's Java/Fabric toolchain directly.
//
// Sections in this file, in order:
//   1. Shared repositories (allprojects)
//   2. Aggregate tasks: lint, buildAll
//   3. Origin watermark helpers (shared by section 4) + showOriginWatermarks /
//      cleanOriginWatermarks (disabled) / checkOriginWatermarks
//   3b. copyDirRecursive / zipDirectory helpers (used by zipPacks) +
//       findMissingWatermarks provenance-guard helper (shared by
//       zipPacks and checkOriginWatermarks)
//   4. zipPacks - packages every pack under packs/ into build/packs-dist/
//   5. Shared datapack-validation helpers + checkPacks / printPackList /
//      printPackFormats / printModList / printModVersions - pack.mcmeta +
//      JSON + reference validation and listing (checkPacks also supports
//      -PcheckPacksReport=<path> to write a JSON summary)
//   6. mergeDatapacks - merges packs/merge-manifest.json into one datapack
//      with a gated load/tick system, kill-switch, toggleable debug, and
//      load-error checking (+ .zip output). -PmergeManifest=<path> reads an
//      alternate manifest; -PmergeReport=<path> writes a JSON run summary.
//   7. clean task extension - also wipes build/packs-dist and packs-remap
//   8. Root 'build'/'check' lifecycle tasks - 'build' runs mergeDatapacks
//      and copies its output into build/dist/
//
// Logging convention: every task prefixes its own output with "[taskName]"
// so `gradle buildAll` (which runs several of these back to back) never
// produces an ambiguous line - you can always tell which task printed what.
//
// Gradle 10 compatibility note: every doFirst/doLast/configureEach action in
// this file avoids live Project API access at execution time (the bare
// 'subprojects' getter, 'project.hasProperty'/'project.property', 'file(...)',
// and AntBuilder via 'ant.copy'/'ant.zip' all resolve through Project, and
// Gradle deprecated - and will remove in Gradle 10 - calling any of them once
// a task is executing). Anything a doFirst/doLast needs from the Project is
// captured into a plain local variable during configuration instead; see the
// comments on 'lint', 'buildAll', 'zipPacks', and the 'clean' extension.
// =============================================================================

// -----------------------------------------------------------------------
// 1. Shared repositories
// -----------------------------------------------------------------------
allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
    }
}

// -----------------------------------------------------------------------
// 2. Aggregate tasks
// -----------------------------------------------------------------------
tasks.register('lint') {
    group = 'verification'
    description = 'Runs checkstyle across all subprojects where configured.'
    // Real task dependency (rather than manually invoking action.execute())
    // so up-to-date checks, the task graph, and logging all work correctly.
    def checkstyleTasks = subprojects.collect { sub -> sub.tasks.matching { it.name == 'checkstyleMain' } }
    dependsOn checkstyleTasks
    // Captured at configuration time: the bare 'subprojects' getter resolves
    // through Project, and calling it (like project.hasProperty/ant.copy
    // elsewhere in this file) from inside doFirst/doLast is the deprecated,
    // Gradle-10-incompatible "Task.project at execution time" pattern.
    def totalSubprojectCount = subprojects.size()
    def withCheckstylePaths = subprojects.findAll { sub -> sub.tasks.findByName('checkstyleMain') != null }.collect { it.path }
    doFirst {
        println "[lint] running checkstyleMain on ${withCheckstylePaths.size()}/${totalSubprojectCount} subproject(s):"
        withCheckstylePaths.each { println "[lint]   - ${it}" }
    }
    doLast {
        println "[lint] completed (ran checkstyleMain where present)."
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all subprojects.'
    // Lazy provider (not an eager .collect{} of resolved tasks at
    // configuration time) so this doesn't fail if a subproject doesn't have
    // a 'build' task yet.
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'build' } }
    // Captured at configuration time - see the 'lint' task above for why.
    def totalSubprojectCount = subprojects.size()
    def buildableCount = subprojects.count { it.tasks.findByName('build') != null }
    doFirst {
        println "[buildAll] building ${buildableCount}/${totalSubprojectCount} subproject(s) that declare a 'build' task."
    }
    doLast {
        println "[buildAll] done."
    }
}

// -----------------------------------------------------------------------
// 3. Origin watermark helpers
//
// Every pack under packs/ is expected to carry a _vc_origin.mcfunction file
// (under data/<namespace>/function/) proving it came from this monorepo and
// wasn't hand-assembled or swapped before packaging. Kept as shared closures
// so zipPacks, showOriginWatermarks, and cleanOriginWatermarks all agree on
// how a watermark file - and a pack directory - is found.
// -----------------------------------------------------------------------
def findOriginWatermarks = { File packsRoot ->
    def found = []
    if (packsRoot.exists()) {
        packsRoot.eachFileRecurse { f ->
            if (f.name == '_vc_origin.mcfunction' && !f.path.contains("${File.separator}build${File.separator}")) {
                found << f
            }
        }
    }
    found
}

def findPackDirs = { File packsRoot ->
    def dirs = []
    if (packsRoot.exists()) {
        packsRoot.eachFileRecurse { f ->
            if (f.name == 'pack.mcmeta' && !f.path.contains("${File.separator}build${File.separator}")) {
                dirs << f.parentFile
            }
        }
    }
    dirs
}

// Shared provenance guard: given the pack dirs found by findPackDirs, returns
// how many were exempted as resource-pack-only, and which datapacks are
// missing their _vc_origin.mcfunction watermark. Used by both zipPacks (which
// aborts the build on a miss) and checkOriginWatermarks (a standalone,
// non-interactive check with no zip/build side effects) so the "what counts
// as missing a watermark" logic is defined exactly once.
def findMissingWatermarks = { List<File> packDirs ->
    def resourcePackCount = 0
    def missing = packDirs.findAll { dir ->
        def isResourcePack = new File(dir, 'assets').exists() && !new File(dir, 'data').exists()
        if (isResourcePack) {
            resourcePackCount++
            return false
        }
        def hasWatermark = false
        dir.eachFileRecurse { f ->
            if (f.name == '_vc_origin.mcfunction') {
                hasWatermark = true
            }
        }
        !hasWatermark
    }
    [resourcePackCount: resourcePackCount, missing: missing]
}

// -----------------------------------------------------------------------
// 3b. Copy/zip helpers (used by zipPacks)
//
// Deliberately plain java.nio.file/java.util.zip instead of ant.copy/
// ant.zip: AntBuilder is exposed via Project.getAnt(), and calling it from
// inside a doLast/doFirst action is exactly the "Invocation of Task.project
// at execution time" pattern Gradle deprecated and removes in Gradle 10.
// These helpers touch no Project API at all, so they stay valid there with
// no change in behavior (same recursive copy, same zip entry layout).
// -----------------------------------------------------------------------
// SECURITY: copyDirRecursive/zipDirectory previously copied and zipped
// *every* file under a pack directory with zero filtering. That means a
// stray .git/, .env, IDE folder, or credential file accidentally sitting
// inside a packs/<name>/ directory would be silently included in the
// public distribution ZIP shipped to Modrinth/CurseForge/GitHub Releases.
// Nothing sensitive was found in any current packs/ directory (checked),
// but the pipeline itself had no safety net against it happening in the
// future. This denylist is defense-in-depth, not a full whitelist rewrite
// (that would need to know every legitimate top-level file every pack
// uses, which risks silently dropping something valid) -- it blocks the
// specific, well-known classes of accidental leaks the packaging skill
// calls out.
def SENSITIVE_PATH_NAMES = ['.git', '.env', '.idea', '.vscode', '.DS_Store', 'Thumbs.db', 'node_modules'] as Set
def isSensitivePathEntry = { File srcDir, File f ->
    srcDir.toPath().relativize(f.toPath()).any { part ->
        def name = part.toString()
        SENSITIVE_PATH_NAMES.contains(name) ||
            name.startsWith('.env.') ||
            name.endsWith('.pem') ||
            name.endsWith('.key') ||
            name.endsWith('.p12')
    }
}

def copyDirRecursive = { File srcDir, File destDir ->
    srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
        if (isSensitivePathEntry(srcDir, f)) return
        def rel = srcDir.toPath().relativize(f.toPath())
        def target = destDir.toPath().resolve(rel)
        java.nio.file.Files.createDirectories(target.parent)
        java.nio.file.Files.copy(f.toPath(), target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def zipDirectory = { File srcDir, File zipFile ->
    zipFile.parentFile.mkdirs()
    new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(zipFile)).withCloseable { zos ->
        def files = []
        // Second, independent check at zip time (not just at copy time):
        // stays correct even if a future caller zips a directory directly
        // without going through copyDirRecursive first.
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f -> if (!isSensitivePathEntry(srcDir, f)) files << f }
        files.sort { it.path }.each { f ->
            def rel = srcDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
            zos.putNextEntry(new java.util.zip.ZipEntry(rel))
            f.withInputStream { is -> zos << is }
            zos.closeEntry()
        }
    }
}

tasks.register('showOriginWatermarks') {
    group = 'verification'
    description = 'Prints the content of every _vc_origin.mcfunction watermark found under packs/.'
    def packsRoot = rootProject.file('packs')
    doLast {
        def watermarks = findOriginWatermarks(packsRoot)
        if (watermarks.isEmpty()) {
            println "[showOriginWatermarks] no _vc_origin.mcfunction watermark files found under packs/."
            return
        }
        println "[showOriginWatermarks] found ${watermarks.size()} watermark file(s):"
        watermarks.sort { it.path }.each { f ->
            println "==================================================================="
            println "Watermark: ${packsRoot.toPath().relativize(f.toPath())}"
            println "-------------------------------------------------------------------"
            println f.text
        }
        println "==================================================================="
        println "[showOriginWatermarks] ${watermarks.size()} watermark file(s) listed."
    }
}

// cleanOriginWatermarks: DISABLED BY DESIGN.
//
// Previously this task deleted _vc_origin.mcfunction files from packs/ (the
// real source tree) as a finalizedBy step after zipPacks. That is no longer
// the desired behavior: watermarks must persist permanently in packs/ as
// proof of origin, and are only ever stripped from the disposable
// build/packs-remap/ working copy that zipPacks builds ZIPs from (see
// section 4). This task stays registered - so external references to
// `cleanOriginWatermarks` don't break - but always refuses to run, so
// nothing can delete a watermark from packs/ anymore, accidentally or
// otherwise.
tasks.register('cleanOriginWatermarks') {
    group = 'build'
    description = 'DISABLED: watermarks in packs/ are no longer deleted by the build. See zipPacks (build/packs-remap/).'
    doLast {
        throw new GradleException(
            "[cleanOriginWatermarks] disabled: watermarks in packs/ are permanent and are never deleted " +
            "by this build anymore. zipPacks now strips watermarks only from the disposable " +
            "build/packs-remap/ copy it builds ZIPs from. packs/ is never touched."
        )
    }
}

// checkOriginWatermarks: standalone, non-interactive provenance check.
//
// zipPacks already refuses to build if a datapack is missing its watermark,
// but that check only runs as a side effect of the full (interactive,
// confirmation-gated) zip build. There was previously no way to ask "does
// every pack have its watermark?" on its own - e.g. in a PR-check CI job
// that shouldn't also produce ZIPs or prompt for confirmation. This task
// runs the same findMissingWatermarks guard used by zipPacks, but only
// reads packs/ - it never writes to build/ and never touches packs/.
tasks.register('checkOriginWatermarks') {
    group = 'verification'
    description = 'Verifies every non-resource-pack folder under packs/ has a _vc_origin.mcfunction watermark. Read-only: unlike zipPacks, never prompts, never zips, never touches build/.'
    def packsRoot = rootProject.file('packs')
    doLast {
        def packDirs = findPackDirs(packsRoot)
        println "[checkOriginWatermarks] scanning ${packsRoot} -> found ${packDirs.size()} pack(s) with a pack.mcmeta."
        if (packDirs.isEmpty()) {
            return
        }
        def guard = findMissingWatermarks(packDirs)
        def watermarkedCount = packDirs.size() - guard.resourcePackCount - guard.missing.size()
        println "[checkOriginWatermarks] ${guard.resourcePackCount} resource-pack-only dir(s) exempted, " +
                "${watermarkedCount} datapack(s) have a watermark."
        if (guard.missing) {
            def details = guard.missing.collect { "  - ${packsRoot.toPath().relativize(it.toPath())}" }.join('\n')
            throw new GradleException(
                "[checkOriginWatermarks] failed: the following pack(s) are missing a _vc_origin.mcfunction " +
                "watermark under data/<namespace>/function/:\n${details}"
            )
        }
        println "[checkOriginWatermarks] OK: all ${watermarkedCount} datapack(s) have a watermark."
    }
}

// -----------------------------------------------------------------------
// 4. zipPacks
//
// Finds every folder under packs/ containing a pack.mcmeta (datapack or
// resource pack, data/ and/or assets/) and zips each one independently into
// build/packs-dist/<folder-name>.zip.
//
// The source tree under packs/ is NEVER modified. Watermarks stay in
// packs/ permanently as proof of origin.
//
// Flow:
//   1. Provenance guard on packs/ (datapacks only): every pack that isn't a
//      pure resource pack must already have its watermark, or the build
//      fails before anything is copied/zipped.
//   2. Confirmation gate: requires -PconfirmZip=yes, or an interactive
//      "yes" typed within a bounded timeout.
//   3. Each pack dir is COPIED to build/packs-remap/<pack-name>/.
//   4. The watermark is removed ONLY from the build/packs-remap/ copy.
//   5. The ZIP is built from the cleaned build/packs-remap/ copy, so the
//      final .zip does NOT contain _vc_origin.mcfunction.
//   6. packs/ itself is untouched at every step - nothing is ever deleted
//      from the repository.
// -----------------------------------------------------------------------
tasks.register('zipPacks') {
    group = 'build'
    description = 'Zips every pack.mcmeta-containing folder under packs/ into build/packs-dist/, stripping watermarks from a build/packs-remap/ copy only (packs/ is never modified).'
    def packsRoot = rootProject.file('packs')
    def remapDir = file('build/packs-remap')
    def outDir = file('build/packs-dist')
    // Captured at configuration time (task registration body runs during
    // configuration, not execution). '-P' project properties are fixed for
    // the whole build invocation before configuration even starts, so
    // reading it here is equivalent to reading it later - but reading it
    // later, from inside doFirst, would be a live 'project.hasProperty'/
    // 'project.property' call during task execution, which Gradle
    // deprecated and removes in Gradle 10 ("Invocation of Task.project at
    // execution time"). See also the 'lint'/'buildAll' tasks above, and the
    // copyDirRecursive/zipDirectory helpers (section 3b) for the same fix
    // applied to ant.copy/ant.zip below.
    def confirmZipProp = project.findProperty('confirmZip')

    doFirst {
        def packDirs = findPackDirs(packsRoot)
        println "[zipPacks] scanning ${packsRoot} -> found ${packDirs.size()} pack(s) with a pack.mcmeta."
        if (packDirs.isEmpty()) {
            return
        }

        // 1. Provenance guard: datapacks must have watermarks; resource packs (assets/ only) bypass this check.
        //    Shared with checkOriginWatermarks - see findMissingWatermarks (section 3b).
        def guard = findMissingWatermarks(packDirs)
        println "[zipPacks] provenance guard: ${guard.resourcePackCount} resource-pack-only dir(s) exempted, " +
                "${packDirs.size() - guard.resourcePackCount - guard.missing.size()} datapack(s) have a watermark."
        if (guard.missing) {
            def details = guard.missing.collect { "  - ${packsRoot.toPath().relativize(it.toPath())}" }.join('\n')
            throw new GradleException(
                "[zipPacks] failed: the following pack(s) are missing a _vc_origin.mcfunction watermark " +
                "under data/<namespace>/function/, so provenance cannot be verified before packaging:\n${details}\n" +
                "Add the watermark before zipping."
            )
        }

        // 2. Pre-zip warning + confirmation.
        def watermarks = findOriginWatermarks(packsRoot)
        println "==================================================================="
        println "vortacraftmc/core - Unlicense (public domain)"
        println "See LICENSE for full license text and NOTICE.md / CONTRIBUTING.md"
        println "for the project's usage and _vc_origin.mcfunction watermark policy."
        println "-------------------------------------------------------------------"
        println "About to package ${packDirs.size()} pack(s) into ZIP archives."
        println "Watermarks stay untouched in packs/. They will only be stripped from"
        println "the build/packs-remap/ working copy used to build the ZIPs:"
        watermarks.sort { it.path }.each { f ->
            println "  - ${packsRoot.toPath().relativize(f.toPath())}"
        }
        println "==================================================================="

        def confirmed = false
        if (confirmZipProp != null) {
            confirmed = (confirmZipProp.toString().toLowerCase() == 'yes')
            println "[zipPacks] -PconfirmZip=${confirmZipProp} supplied on the command line."
            if (!confirmed) {
                throw new GradleException(
                    "[zipPacks] aborted: -PconfirmZip was set but not to 'yes'. Pass -PconfirmZip=yes to proceed."
                )
            }
        } else {
            // System.console() is null in many interactive-but-not-a-real-TTY
            // environments (VS Code integrated terminal, Codespaces, some IDE
            // consoles), which previously made zipPacks abort immediately even
            // though a person was right there able to answer. Read from
            // System.in instead (works in both a real console and these
            // environments), but don't block forever: give it a bounded
            // timeout and treat a timeout as "not confirmed" so a truly
            // non-interactive run (CI with no -PconfirmZip) still fails fast
            // instead of hanging the build.
            def timeoutSeconds = 15
            println "Proceed with packaging (watermarks stripped from the remap copy only)?"
            print "Type 'yes' to continue (auto-cancels in ${timeoutSeconds}s with no input): "
            System.out.flush()

            def answerHolder = new java.util.concurrent.atomic.AtomicReference<String>(null)
            def reader = Thread.start {
                try {
                    def line = System.in.newReader().readLine()
                    answerHolder.set(line)
                } catch (Exception ignored) {
                    // stdin closed/unavailable - leave answerHolder null, handled below
                }
            }
            reader.join(timeoutSeconds * 1000L)

            if (reader.isAlive()) {
                // Timed out waiting for input.
                reader.interrupt()
                throw new GradleException(
                    "[zipPacks] aborted: no 'yes' received within ${timeoutSeconds}s (timed out waiting for input). " +
                    "Re-run and confirm promptly, or pass -PconfirmZip=yes to skip the prompt (e.g. in CI)."
                )
            }

            def answer = answerHolder.get()
            confirmed = (answer?.trim()?.toLowerCase() == 'yes')
            println "[zipPacks] interactive confirmation received: '${answer ?: '<no input>'}'"
            if (!confirmed) {
                throw new GradleException(
                    "[zipPacks] aborted: confirmation not received (expected 'yes', got: ${answer ?: '<no input>'})."
                )
            }
        }
    }

    doLast {
        def packDirs = findPackDirs(packsRoot)
        if (packDirs.isEmpty()) {
            println "[zipPacks] no pack.mcmeta files found under packs/."
            return
        }

        // 3. Fresh remap workspace every run, so stale copies never linger.
        if (remapDir.exists()) {
            println "[zipPacks] clearing stale remap workspace at ${remapDir}"
            remapDir.deleteDir()
        }
        remapDir.mkdirs()
        outDir.mkdirs()

        packDirs.each { dir ->
            def relPath = packsRoot.toPath().relativize(dir.toPath()).toString()
            def safeName = relPath.replace(File.separator, '-').replace('/', '-')

            // Copy source pack -> build/packs-remap/<safeName>/ (packs/ untouched).
            def remapPackDir = new File(remapDir, safeName)
            remapPackDir.mkdirs()
            copyDirRecursive(dir, remapPackDir)

            // 4. Strip the watermark from the remap copy only.
            def stripped = 0
            remapPackDir.eachFileRecurse { f ->
                if (f.name == '_vc_origin.mcfunction') {
                    f.delete()
                    stripped++
                }
            }

            // 5. Zip from the cleaned remap copy.
            def zipName = "${safeName}.zip"
            def zipFile = new File(outDir, zipName)
            println "[zipPacks] zipping ${remapPackDir} -> build/packs-dist/${zipName} (stripped ${stripped} watermark(s) from remap copy)"
            zipDirectory(remapPackDir, zipFile)
        }
        println "[zipPacks] done: ${packDirs.size()} pack(s) zipped into ${outDir}. packs/ source tree left untouched."
    }
}

// Make zipPacks run as part of the normal build
tasks.named('buildAll') { dependsOn 'zipPacks' }

// -----------------------------------------------------------------------
// 5. Shared datapack-validation helpers + checkPacks / printPackList /
//    printModList
//
// The vc* helpers below are shared by checkPacks (this section) and
// mergeDatapacks (section 6) so "what counts as a valid pack / format /
// resolvable function reference" is defined exactly once:
//   - vcIsValidNamespace - [a-z0-9_.-]+ resource-location namespace rule
//   - vcNormalizeFormatValue / vcCompareFormats - int or [major, minor]
//     pack-format handling (minor versions exist for new formats, e.g.
//     "min_format": [121, 1])
//   - vcSanitizePackId - safe [a-z0-9_] id derived from a pack dir name,
//     used for storage paths, wrapper function paths and scoreboard names
//   - vcParseFunctionRef / vcResolveFunctionRef - 'ns:path' / '#ns:tag'
//     parsing plus an existence check against a pack's data/ root (both
//     the modern singular function/ layout and the legacy plural
//     functions/ layout are accepted)
//   - vcJsonEscape - minimal JSON string escaper for generated tellraws
//   - vcReadTagValues - lenient "values" reader for function-tag files
// -----------------------------------------------------------------------
def vcIsValidNamespace = { String ns ->
    ns != null && (ns ==~ /[a-z0-9_.-]+/)
}

def vcNormalizeFormatValue = { v ->
    if (v instanceof Number) return [v.intValue(), 0]
    if (v instanceof List && (v.size() == 1 || v.size() == 2) && v.every { it instanceof Number }) {
        return [v[0].intValue(), (v.size() == 2 ? v[1].intValue() : 0)]
    }
    return null
}

def vcCompareFormats = { List a, List b ->
    (a[0] != b[0]) ? (a[0] <=> b[0]) : (a[1] <=> b[1])
}

def vcSanitizePackId = { String name ->
    def id = (name ?: 'pack').toLowerCase().replaceAll('[^a-z0-9_]+', '_').replaceAll('^_+|_+$', '')
    if (!id) id = 'pack'
    if (id.length() > 30) id = id.substring(0, 30).replaceAll('_+$', '')
    if (!id) id = 'pack'
    id
}

def vcParseFunctionRef = { String ref ->
    if (ref == null) return null
    def m = (ref =~ /^(#)?([a-z0-9_.-]+):([a-z0-9_.\/-]+)$/)
    if (!m.matches()) return null
    [isTag: m.group(1) == '#', namespace: m.group(2), path: m.group(3)]
}

def vcResolveFunctionRef = { File dataRoot, Map ref ->
    if (ref.isTag) {
        return new File(dataRoot, "${ref.namespace}/tags/function/${ref.path}.json").exists() ||
            new File(dataRoot, "${ref.namespace}/tags/functions/${ref.path}.json").exists()
    }
    return new File(dataRoot, "${ref.namespace}/function/${ref.path}.mcfunction").exists() ||
        new File(dataRoot, "${ref.namespace}/functions/${ref.path}.mcfunction").exists()
}

def vcJsonEscape = { String s ->
    (s ?: '').replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
}

def vcReadTagValues = { groovy.json.JsonSlurper slurper, File tagFile ->
    if (tagFile == null || !tagFile.exists()) return null
    try {
        def parsed = slurper.parse(tagFile)
        return (parsed instanceof Map && parsed.values instanceof List) ? parsed.values : null
    } catch (Exception ignored) {
        return null
    }
}

tasks.register('checkPacks') {
    group = 'verification'
    description = 'Validates every pack under packs/: pack.mcmeta (format range, description, overlays, filter), every JSON under data/, namespace rules, and load/tick + function reference resolution. Warnings fail the build only with -PcheckPacksStrict=true; -PcheckPacksJson=mcmeta checks pack.mcmeta files only; -PcheckPacksReport=<path> also writes a JSON summary to that path.'
    def packsRoot = rootProject.file('packs')
    // Captured at configuration time - see the 'lint' task above for why
    // 'project.findProperty' can't be called from inside doLast itself.
    def jsonScopeProp = project.findProperty('checkPacksJson')
    def strictProp = project.findProperty('checkPacksStrict')
    def reportPathProp = project.findProperty('checkPacksReport')
    def reportProjectDir = projectDir
    doLast {
        def jsonScope = (jsonScopeProp ?: 'all').toString().toLowerCase()
        def strict = (strictProp?.toString()?.toLowerCase() == 'true')
        if (!packsRoot.exists()) {
            println "[checkPacks] no packs/ directory found, skipping."
            return
        }
        println "[checkPacks] scope: json=${jsonScope}, strict=${strict}."
        def slurper = new groovy.json.JsonSlurper()
        def packDirs = findPackDirs(packsRoot)
        def errors = []
        def warnings = []
        def jsonChecked = 0
        def funcChecked = 0

        packDirs.sort { it.path }.each { dir ->
            def packLabel = packsRoot.toPath().relativize(dir.toPath()).toString()
            def metaFile = new File(dir, 'pack.mcmeta')
            def meta = null
            try {
                meta = slurper.parse(metaFile)
            } catch (Exception e) {
                errors << "${packLabel}/pack.mcmeta: invalid JSON - ${e.message}"
                return
            }
            def pack = (meta instanceof Map) ? meta.pack : null
            if (!(pack instanceof Map)) {
                errors << "${packLabel}/pack.mcmeta: missing 'pack' object"
                return
            }
            // --- format declarations (legacy pack_format and/or 1.21.9+ min/max) ---
            def legacyFmt = vcNormalizeFormatValue(pack.pack_format)
            def minFmt = vcNormalizeFormatValue(pack.min_format)
            def maxFmt = vcNormalizeFormatValue(pack.max_format)
            if (pack.pack_format != null && legacyFmt == null) {
                errors << "${packLabel}/pack.mcmeta: 'pack.pack_format' must be an int or [major, minor] pair, got: ${pack.pack_format}"
            }
            if ((pack.min_format != null || pack.max_format != null) && (minFmt == null || maxFmt == null)) {
                errors << "${packLabel}/pack.mcmeta: 'pack.min_format'/'pack.max_format' must each be an int or [major, minor] pair"
            } else if (minFmt != null && maxFmt != null && vcCompareFormats(minFmt, maxFmt) > 0) {
                errors << "${packLabel}/pack.mcmeta: min_format ${pack.min_format} is newer than max_format ${pack.max_format}"
            }
            if (pack.pack_format == null && (minFmt == null || maxFmt == null)) {
                errors << "${packLabel}/pack.mcmeta: neither 'pack.pack_format' nor 'pack.min_format'+'max_format' present"
            }
            if (pack.supported_formats != null && !(pack.supported_formats instanceof List) && !(pack.supported_formats instanceof Map)) {
                warnings << "${packLabel}/pack.mcmeta: 'pack.supported_formats' should be a list or {min_inclusive,max_inclusive} object"
            }
            // --- description (string, single component, or component list) ---
            def desc = pack.description
            if (desc == null) {
                warnings << "${packLabel}/pack.mcmeta: missing 'pack.description'"
            } else if (!(desc instanceof String) && !(desc instanceof Map) && !(desc instanceof List)) {
                errors << "${packLabel}/pack.mcmeta: 'pack.description' must be a string, text component, or list of components"
            } else if (desc instanceof List && !desc.every { it instanceof String || it instanceof Map }) {
                errors << "${packLabel}/pack.mcmeta: 'pack.description' list entries must be strings or text components"
            }
            // --- overlays: {entries: [{formats, directory}]} + dir must exist ---
            if (pack.overlays != null) {
                def entries = (pack.overlays instanceof Map) ? pack.overlays.entries : null
                if (!(entries instanceof List)) {
                    warnings << "${packLabel}/pack.mcmeta: 'pack.overlays' should be {\"entries\": [...]}"
                } else {
                    entries.eachWithIndex { entry, idx ->
                        if (!(entry instanceof Map) || entry.directory == null || entry.formats == null) {
                            warnings << "${packLabel}/pack.mcmeta: overlays.entries[${idx}] needs 'formats' + 'directory'"
                        } else if (!new File(dir, "overlays/${entry.directory}").exists()) {
                            warnings << "${packLabel}/pack.mcmeta: overlays.entries[${idx}] directory 'overlays/${entry.directory}' does not exist"
                        }
                    }
                }
            }
            // --- filter.block[]: each entry needs namespace + path ---
            if (meta.filter != null) {
                def blocks = (meta.filter instanceof Map) ? meta.filter.block : null
                if (blocks != null) {
                    if (!(blocks instanceof List)) {
                        warnings << "${packLabel}/pack.mcmeta: 'filter.block' should be a list"
                    } else {
                        blocks.eachWithIndex { b, idx ->
                            if (!(b instanceof Map) || b.namespace == null || b.path == null) {
                                warnings << "${packLabel}/pack.mcmeta: filter.block[${idx}] needs 'namespace' + 'path'"
                            }
                        }
                    }
                }
            }

            if (jsonScope == 'mcmeta') return

            def dataRoot = new File(dir, 'data')
            if (!dataRoot.exists()) {
                if (!new File(dir, 'assets').exists()) {
                    warnings << "${packLabel}: pack has neither data/ nor assets/ - nothing to load"
                }
                return
            }
            // --- namespace rules (vanilla requires lowercase [a-z0-9_.-]) ---
            dataRoot.eachFile { nsDir ->
                if (nsDir.isDirectory() && !vcIsValidNamespace(nsDir.name)) {
                    warnings << "${packLabel}: invalid namespace '${nsDir.name}' (must match [a-z0-9_.-]+, lowercase)"
                }
            }
            // --- every JSON under data/ must parse; tags need "values" ---
            def jsonFiles = []
            dataRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.json')) jsonFiles << f
            }
            jsonFiles.sort { it.path }.each { jf ->
                jsonChecked++
                def rel = dir.toPath().relativize(jf.toPath()).toString().replace(File.separator, '/')
                def parsed = null
                try {
                    parsed = slurper.parse(jf)
                } catch (Exception e) {
                    errors << "${packLabel}/${rel}: invalid JSON - ${e.message}"
                    return
                }
                if (rel.contains('/tags/')) {
                    if (!(parsed instanceof Map) || !(parsed.values instanceof List)) {
                        warnings << "${packLabel}/${rel}: tag file should be an object with a \"values\" array"
                    }
                } else if (!(parsed instanceof Map)) {
                    def actual = (parsed == null) ? 'null' : parsed.getClass().simpleName
                    warnings << "${packLabel}/${rel}: data JSON should be an object (top-level ${actual})"
                }
            }
            // --- minecraft load/tick references: resolvable or external ---
            ['load', 'tick'].each { hook ->
                ['function', 'functions'].each { tagsDir ->
                    def tagFile = new File(dataRoot, "minecraft/tags/${tagsDir}/${hook}.json")
                    def values = vcReadTagValues(slurper, tagFile)
                    if (values == null) return
                    values.each { v ->
                        if (!(v instanceof String)) {
                            warnings << "${packLabel}/data/minecraft/tags/${tagsDir}/${hook}.json: non-string tag value: ${v}"
                            return
                        }
                        def ref = vcParseFunctionRef(v.toString())
                        if (ref == null) {
                            warnings << "${packLabel}/data/minecraft/tags/${tagsDir}/${hook}.json: malformed reference '${v}'"
                        } else if (!vcResolveFunctionRef(dataRoot, ref)) {
                            warnings << "${packLabel}/data/minecraft/tags/${tagsDir}/${hook}.json: '${v}' not found in this pack (external pack or typo)"
                        }
                    }
                }
            }
            // --- 'function <ref>' lines inside .mcfunction files ---
            def packFuncWarnings = 0
            def funcFiles = []
            dataRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.mcfunction')) funcFiles << f
            }
            funcFiles.sort { it.path }.each { ff ->
                funcChecked++
                if (packFuncWarnings > 25) return
                def rel = dir.toPath().relativize(ff.toPath()).toString().replace(File.separator, '/')
                def lineNo = 0
                ff.eachLine { line ->
                    lineNo++
                    if (packFuncWarnings > 25) return
                    def trimmed = line.trim()
                    if (!trimmed || trimmed.startsWith('#')) return
                    if (trimmed.contains('$(')) return // macro line - cannot resolve statically
                    def m = (trimmed =~ /\bfunction\s+(#?[A-Za-z0-9_.\/-]+:[A-Za-z0-9_.\/-]+)/)
                    while (m.find()) {
                        def refText = m.group(1)
                        if (refText.contains('$')) continue
                        def ref = vcParseFunctionRef(refText)
                        if (ref == null) {
                            warnings << "${packLabel}/${rel}:${lineNo}: suspicious function reference '${refText}'"
                            packFuncWarnings++
                        } else if (!vcResolveFunctionRef(dataRoot, ref)) {
                            warnings << "${packLabel}/${rel}:${lineNo}: unresolved 'function ${refText}' (external pack or typo)"
                            packFuncWarnings++
                        }
                    }
                }
            }
            if (packFuncWarnings > 25) {
                warnings << "${packLabel}: ... (function-reference warnings truncated at 25 for this pack)"
            }
        }

        println "[checkPacks] checked ${packDirs.size()} pack(s), ${jsonChecked} JSON file(s), ${funcChecked} function file(s): ${errors.size()} error(s), ${warnings.size()} warning(s)."
        warnings.each { println "[checkPacks] WARN: ${it}" }
        if (reportPathProp) {
            def reportFile = new File(reportPathProp.toString()).with { it.isAbsolute() ? it : new File(reportProjectDir, it.path) }
            reportFile.parentFile?.mkdirs()
            def json = new StringBuilder()
            json << '{\n'
            json << "  \"packCount\": ${packDirs.size()},\n"
            json << "  \"jsonChecked\": ${jsonChecked},\n"
            json << "  \"funcChecked\": ${funcChecked},\n"
            json << "  \"errorCount\": ${errors.size()},\n"
            json << "  \"warningCount\": ${warnings.size()},\n"
            json << '  "errors": [' << errors.collect { "\"${vcJsonEscape(it)}\"" }.join(', ') << '],\n'
            json << '  "warnings": [' << warnings.collect { "\"${vcJsonEscape(it)}\"" }.join(', ') << ']\n'
            json << '}\n'
            reportFile.text = json.toString()
            println "[checkPacks] wrote report -> ${reportFile}"
        }
        if (errors) {
            errors.each { println "[checkPacks] ERROR: ${it}" }
            throw new GradleException("[checkPacks] failed: ${errors.size()} error(s) in ${packDirs.size()} pack(s).")
        }
        if (strict && warnings) {
            throw new GradleException("[checkPacks] failed strict mode: ${warnings.size()} warning(s) treated as errors (-PcheckPacksStrict=true).")
        }
        println "[checkPacks] OK: all pack.mcmeta files are valid."
    }
}
// Require validation before zipPacks
tasks.named('zipPacks') { dependsOn 'checkPacks' }

tasks.register('printPackList') {
    group = 'help'
    description = 'Lists every detected pack folder under packs/ without zipping anything.'
    def packsRoot = rootProject.file('packs')
    doLast {
        if (!packsRoot.exists()) {
            println "[printPackList] no packs/ directory found."
            return
        }
        def found = []
        packsRoot.eachFileRecurse { f ->
            if (f.name == 'pack.mcmeta' && !f.path.contains("${File.separator}build${File.separator}")) {
                found << packsRoot.toPath().relativize(f.parentFile.toPath()).toString()
            }
        }
        if (found.isEmpty()) {
            println "[printPackList] no packs found."
        } else {
            println "[printPackList] detected ${found.size()} pack(s):"
            found.sort().each { println "[printPackList]   - ${it}" }
        }
    }
}

// printPackFormats: printPackList above only tells you a pack exists; this
// answers the next question you'd usually then have to open pack.mcmeta
// for - what pack_format (or min_format/max_format range) it declares.
// Read-only, same as printPackList - it does not run any of checkPacks'
// validation and will not fail the build on a bad or missing format.
tasks.register('printPackFormats') {
    group = 'help'
    description = 'Lists every detected pack under packs/ with its declared pack_format (or min_format-max_format range), without validating anything.'
    def packsRoot = rootProject.file('packs')
    doLast {
        if (!packsRoot.exists()) {
            println "[printPackFormats] no packs/ directory found."
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        def packDirs = findPackDirs(packsRoot)
        if (packDirs.isEmpty()) {
            println "[printPackFormats] no packs found."
            return
        }
        println "[printPackFormats] ${packDirs.size()} pack(s):"
        packDirs.sort { it.path }.each { dir ->
            def packLabel = packsRoot.toPath().relativize(dir.toPath()).toString()
            def metaFile = new File(dir, 'pack.mcmeta')
            def rangeText
            try {
                def meta = slurper.parse(metaFile)
                def pack = (meta instanceof Map) ? meta.pack : null
                def minFmt = (pack instanceof Map) ? vcNormalizeFormatValue(pack.min_format) : null
                def maxFmt = (pack instanceof Map) ? vcNormalizeFormatValue(pack.max_format) : null
                def legacyFmt = (pack instanceof Map) ? vcNormalizeFormatValue(pack.pack_format) : null
                if (minFmt != null && maxFmt != null) {
                    rangeText = "min_format=${minFmt.join('.')} max_format=${maxFmt.join('.')}"
                } else if (legacyFmt != null) {
                    rangeText = "pack_format=${legacyFmt.join('.')}"
                } else {
                    rangeText = '(no valid format declared)'
                }
            } catch (Exception e) {
                rangeText = "(invalid pack.mcmeta: ${e.message})"
            }
            println "[printPackFormats]   - ${packLabel}: ${rangeText}"
        }
    }
}

// printModList: the mods/ counterpart to printPackList above. There was
// previously no way to list mod subprojects without either reading
// settings.gradle by hand or running a real build ('buildAll'/':mods:x:build').
// A mod folder is detected the same way Gradle itself would include it as a
// subproject: it's an immediate child of mods/ with its own build.gradle.
tasks.register('printModList') {
    group = 'help'
    description = 'Lists every detected Fabric mod folder under mods/ (immediate subfolders with their own build.gradle) without building anything.'
    def modsRoot = rootProject.file('mods')
    doLast {
        if (!modsRoot.exists()) {
            println "[printModList] no mods/ directory found."
            return
        }
        def found = []
        modsRoot.eachFile { d ->
            if (d.isDirectory() && new File(d, 'build.gradle').exists()) {
                found << d.name
            }
        }
        if (found.isEmpty()) {
            println "[printModList] no mods found."
        } else {
            println "[printModList] detected ${found.size()} mod(s):"
            found.sort().each { println "[printModList]   - ${it}" }
        }
    }
}

// printModVersions: the id/version counterpart to printModList above -
// read-only, does not build anything, and tolerates a missing or invalid
// fabric.mod.json (reported inline rather than failing the task) since
// unlike verifyMod this task is meant for a quick listing, not validation.
tasks.register('printModVersions') {
    group = 'help'
    description = 'Lists every detected Fabric mod under mods/ with its id and version from fabric.mod.json, without building anything.'
    def modsRoot = rootProject.file('mods')
    doLast {
        if (!modsRoot.exists()) {
            println "[printModVersions] no mods/ directory found."
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        def found = []
        modsRoot.eachFile { d ->
            if (d.isDirectory() && new File(d, 'build.gradle').exists()) {
                def modJsonFile = new File(d, 'src/main/resources/fabric.mod.json')
                def label
                if (modJsonFile.exists()) {
                    try {
                        def modJson = slurper.parse(modJsonFile)
                        label = "${modJson.id ?: '?'} (v${modJson.version ?: '?'})"
                    } catch (Exception e) {
                        label = "(invalid fabric.mod.json: ${e.message})"
                    }
                } else {
                    label = '(no fabric.mod.json found)'
                }
                found << "${d.name}: ${label}"
            }
        }
        if (found.isEmpty()) {
            println "[printModVersions] no mods found."
        } else {
            println "[printModVersions] detected ${found.size()} mod(s):"
            found.sort().each { println "[printModVersions]   - ${it}" }
        }
    }
}

// -----------------------------------------------------------------------
// 6. mergeDatapacks
//
// Reads packs/merge-manifest.json and merges the listed pack folders under
// packs/ into a single output datapack at build/merged-datapack/ (plus a
// distributable .zip next to it). Non-JSON files are copied straight
// through. Colliding files are handled explicitly, never silently
// overwritten:
//   - data/.../tags/function(s)/*.json (except the minecraft load/tick
//     tags in gated mode) are merged by unioning their "values" arrays,
//     since every pack's load/tick hook lives there and a plain copy
//     would let the last pack processed clobber every other pack's hook.
//   - any other file path that appears in more than one included pack
//     fails the build loudly, since there's no generically safe way to
//     merge two different function/loot_table/etc. files.
// pack_format mismatches across included packs also fail the build unless
// the manifest sets "allowMismatchedFormats": true, because packs in this
// repo span pack_format 10-101 (roughly MC 1.16-1.21.9+) and silently
// merging across that range produces a broken pack.
//
// Manifest options (only "output" + "include" are required):
//   output:  { description, pack_format? | min_format+max_format, name? }
//   include: ["packA", "nested/dir/packB"], exclude: [...]
//   allowMismatchedFormats: false  (default) - fail on format mismatch
//   gatedLoad: true  (default) - route every pack's minecraft:load/tick
//     hooks through a generated <namespace>:load / <namespace>:tick
//     gatekeeper so packs can be toggled without editing tags. false
//     restores the legacy plain union-merge of the load/tick tags.
//   namespace: "vcm_core"  (default) - namespace for generated files
//   debugDefault: false  (default) - initial debug-message state
//   killSwitch: true  (default, needs gatedLoad) - generate the global
//     enable_all/disable_all kill-switch on top of the per-pack toggles
//   loadErrorHandling: true  (default) - build-time load/tick reference
//     validation plus the runtime error log (api/report_error, errors,
//     errors_clear) and per-pack load markers read by status
//   strictLoadRefs: true  (default) - missing load/tick targets fail the
//     build; false downgrades them to warnings
//   zip: true  (default) - also write build/<output.name>.zip
//   prefixConflicts: false  (default) - when a non-tag file path collides
//     across included packs, fail the build (default) or, if true, ship
//     every colliding version side by side under
//     data/<pack-id>__conflict/... instead of failing.
//   priority: []  (default) - ordered list of pack names from 'include'
//     used to pick a "winning" pack for collision logging/provenance.
//     Override for a single run with -PmergePriority=packA,packB.
//
// Gated-mode runtime API (all under data/<namespace>/function/):
//   load / tick                - minecraft:load/tick entry points
//   packs/<id>/load|tick       - per-pack wrappers calling original hooks
//   packs/<id>/enable|disable  - per-pack toggle (disable calls the pack's
//                                <ns>:unload hook when one exists)
//   packs/<id>/reload          - disable then re-enable a single pack
//   enable_all / disable_all   - global kill-switch (disable_all runs every
//                                known unload hook, then halts tick dispatch)
//   debug/on|off|toggle        - toggleable debug tellraws
//                                (storage <namespace>:config {debug:1b/0b})
//   status                     - global + per-pack load report
//   api/report_error {pack,msg}- macro: alert + append to the error log
//   errors / errors_clear      - view / clear the runtime error log
//
// Other options:
//   -PmergeDryRun=true - run every validation/collision/format check and
//     print the merge plan without writing anything to build/.
// -----------------------------------------------------------------------
tasks.register('mergeDatapacks') {
    group = 'build'
    description = 'Merges packs/merge-manifest.json into build/merged-datapack/ (+ .zip) with a gated load/tick system, kill-switch, toggleable debug, and load-error checking. -PmergeManifest=<path> uses an alternate manifest file; -PmergeReport=<path> also writes a JSON summary of a completed (non-dry-run) merge.'
    def packsRoot = rootProject.file('packs')
    // Captured at configuration time - see the 'lint' task above for why
    // 'project.findProperty' can't be called from inside doLast itself.
    def dryRunProp = project.findProperty('mergeDryRun')
    def priorityProp = project.findProperty('mergePriority')
    def manifestPathProp = project.findProperty('mergeManifest')
    def reportPathProp = project.findProperty('mergeReport')
    def reportProjectDir = projectDir
    // manifestFile/manifestDisplayPath must also be resolved here (file()
    // is a Project API call, same restriction as findProperty above) so
    // -PmergeManifest can point at a manifest anywhere, not just packs/.
    def manifestDisplayPath = manifestPathProp ? manifestPathProp.toString() : 'packs/merge-manifest.json'
    def manifestFile = manifestPathProp ? file(manifestPathProp.toString()) : file('packs/merge-manifest.json')
    def outDir = file('build/merged-datapack')
    def buildDir = file('build')
    doLast {
        def dryRun = (dryRunProp?.toString()?.toLowerCase() == 'true')
        if (dryRun) {
            println "[mergeDatapacks] -PmergeDryRun=true: validation-only run, no files will be written under ${outDir} or ${buildDir}."
        }
        if (!manifestFile.exists()) {
            throw new GradleException("[mergeDatapacks] failed: ${manifestDisplayPath} not found. Create it with { \"output\": {...}, \"include\": [...] }.")
        }
        if (manifestPathProp) {
            println "[mergeDatapacks] using manifest override: ${manifestDisplayPath}"
        }
        def slurper = new groovy.json.JsonSlurper()
        def manifest
        try {
            manifest = slurper.parse(manifestFile)
        } catch (Exception e) {
            throw new GradleException("[mergeDatapacks] failed: packs/merge-manifest.json is not valid JSON - ${e.message}")
        }

        def include = manifest.include ?: []
        def exclude = (manifest.exclude ?: []) as Set
        def output = manifest.output ?: [:]
        def allowMismatchedFormats = manifest.allowMismatchedFormats == true
        def gatedLoad = manifest.gatedLoad != false
        def coreNs = (manifest.namespace ?: 'vcm_core').toString()
        def debugDefault = manifest.debugDefault == true
        def killSwitch = manifest.killSwitch != false
        def loadErrorHandling = manifest.loadErrorHandling != false
        def strictLoadRefs = manifest.strictLoadRefs != false
        def zipEnabled = manifest.zip != false
        // prefixConflicts: instead of hard-failing when the same relative
        // path appears in more than one included pack (and isn't a
        // union-mergeable tags/function(s) file), namespace-prefix every
        // colliding pack's copy under a per-pack subfolder so all versions
        // ship side by side. Off by default - a silent rename is a bigger
        // surprise than a loud failure, so this stays opt-in.
        def prefixConflicts = manifest.prefixConflicts == true
        // priority: explicit include-order override for collision handling.
        // Only meaningful today for logging/provenance (which pack "wins"
        // conceptually) since hard collisions still fail the build unless
        // prefixConflicts is also set; recorded in the manifest json either
        // way so downstream tooling/humans can see the intended order.
        // -PmergePriority=packA,packB on the command line overrides the
        // manifest's own "priority" list for a one-off run.
        def manifestPriority = (manifest.priority instanceof List) ? manifest.priority.collect { it.toString() } : []
        def priority = priorityProp != null
            ? priorityProp.toString().split(',').collect { it.trim() }.findAll { it }
            : manifestPriority
        if (priority) {
            def unknown = priority.findAll { !include.contains(it) }
            if (unknown) {
                println "[mergeDatapacks] WARNING: priority list references pack(s) not in 'include': ${unknown.join(', ')} (ignored)."
            }
            println "[mergeDatapacks] priority order: ${priority.findAll { include.contains(it) }.join(' > ') ?: '(none applicable)'}"
        }

        if (!vcIsValidNamespace(coreNs)) {
            throw new GradleException("[mergeDatapacks] failed: manifest 'namespace' \"${coreNs}\" is invalid (must match [a-z0-9_.-]+, lowercase).")
        }
        if (coreNs == 'minecraft') {
            throw new GradleException("[mergeDatapacks] failed: manifest 'namespace' must not be 'minecraft' (generated files would collide with vanilla tags).")
        }
        if ((coreNs + '.load').length() > 16) {
            throw new GradleException("[mergeDatapacks] failed: manifest 'namespace' \"${coreNs}\" is too long - scoreboard objectives ('${coreNs}.load') are limited to 16 characters.")
        }
        if (!gatedLoad && killSwitch) {
            println "[mergeDatapacks] note: 'killSwitch' needs gatedLoad; skipping kill-switch generation (legacy merge)."
            killSwitch = false
        }

        println "[mergeDatapacks] manifest: ${include.size()} pack(s) listed in 'include', " +
                "${exclude.size()} in 'exclude', allowMismatchedFormats=${allowMismatchedFormats}, " +
                "gatedLoad=${gatedLoad}, namespace=${coreNs}, debugDefault=${debugDefault}, " +
                "killSwitch=${killSwitch}, loadErrorHandling=${loadErrorHandling}, " +
                "strictLoadRefs=${strictLoadRefs}, zip=${zipEnabled}."

        if (include.isEmpty()) {
            throw new GradleException("[mergeDatapacks] failed: manifest 'include' list is empty. Nothing to merge.")
        }

        def packDirs = [:]
        include.each { packName ->
            if (exclude.contains(packName)) {
                println "[mergeDatapacks] skipping ${packName}: listed in manifest 'exclude'."
                return
            }
            // 'include' entries may be a top-level packs/<name> dir, or a
            // relative sub-path like 'dataLib-dp/datapacks/dataLib' for
            // datapacks nested inside a mod/tooling repo folder.
            def dir = new File(packsRoot, packName)
            if (!dir.exists() || !new File(dir, 'pack.mcmeta').exists()) {
                throw new GradleException("[mergeDatapacks] failed: packs/${packName} not found or has no pack.mcmeta.")
            }
            packDirs[packName] = dir
        }

        if (packDirs.isEmpty()) {
            throw new GradleException("[mergeDatapacks] failed: every entry in 'include' was excluded or missing.")
        }
        println "[mergeDatapacks] resolved ${packDirs.size()} pack dir(s) to merge: ${packDirs.keySet().join(', ')}"

        // Validate pack_format compatibility before touching any files.
        // Normalize to the actual numeric format(s) so a pack declaring
        // pack_format=107 and a pack declaring min_format=107/max_format=107
        // are recognized as the same format instead of compared as strings.
        def normalizeFormat = { f ->
            if (f == null) return null
            if (f instanceof List) return f[0]
            return f
        }
        def formats = [:]
        def normFormats = [:]
        def metaCache = [:]
        packDirs.each { packName, dir ->
            def meta = slurper.parse(new File(dir, 'pack.mcmeta'))
            metaCache[packName] = meta
            def pack = meta?.pack
            def fmt = pack?.pack_format != null ? "pack_format=${pack.pack_format}" : "min=${pack?.min_format} max=${pack?.max_format}"
            formats[packName] = fmt
            def minF = pack?.min_format != null ? pack.min_format : pack?.pack_format
            def maxF = pack?.max_format != null ? pack.max_format : pack?.pack_format
            normFormats[packName] = [normalizeFormat(minF), normalizeFormat(maxF)]
        }
        println "[mergeDatapacks] pack_format per pack:"
        formats.each { packName, fmt -> println "[mergeDatapacks]   - ${packName}: ${fmt}" }

        def distinctFormats = normFormats.values().toSet()
        if (distinctFormats.size() > 1 && !allowMismatchedFormats) {
            def details = formats.collect { k, v -> "  - ${k}: ${v}" }.join('\n')
            throw new GradleException(
                "[mergeDatapacks] failed: included packs declare different pack_format values, merging them " +
                "produces a datapack that is broken for at least one of them:\n${details}\n" +
                "Set \"allowMismatchedFormats\": true in the manifest to merge anyway (not recommended)."
            )
        }
        // Overlays are version-sliced file trees (overlays/<dir>/) that this
        // merge does not understand - warn loudly instead of silently
        // shipping only the base data/.
        metaCache.each { packName, meta ->
            if (meta?.pack?.overlays != null) {
                println "[mergeDatapacks] WARNING: ${packName} declares pack.overlays, which are NOT merged - only the base data/ tree is merged. Copy overlays/<dir>/ manually if you need them."
            }
        }

        if (outDir.exists()) {
            println "[mergeDatapacks] clearing stale output at ${outDir}"
            outDir.deleteDir()
        }
        outDir.mkdirs()

        // Collect every relative file path across all included packs so we
        // can detect collisions before writing anything. minecraft load/tick
        // tag values are additionally captured per-pack (for the gated
        // dispatcher, and for load-reference validation in both modes).
        def isFunctionTagFile = { String rel ->
            (rel ==~ /data\/[^\/]+\/tags\/function\/.+\.json/) ||
            (rel ==~ /data\/[^\/]+\/tags\/functions\/.+\.json/)
        }
        def isMinecraftHookTag = { String rel ->
            (rel ==~ /data\/minecraft\/tags\/functions?\/(load|tick)\.json/)
        }
        def relPathToSources = [:]
        def packLoadHooks = [:].withDefault { [] }
        def packTickHooks = [:].withDefault { [] }
        def packReplaceFlags = [:].withDefault { false }
        def skippedSensitive = 0
        packDirs.each { packName, dir ->
            dir.eachFileRecurse { f ->
                if (f.isFile()) {
                    def rel = dir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                    // pack.mcmeta, README, LICENSE, etc. at pack root are per-pack
                    // metadata, not merged content - skip them explicitly.
                    if (!rel.contains('/')) {
                        return
                    }
                    // Same sensitive-file denylist as zipPacks: a stray .git/
                    // or credential file must never end up in merged output.
                    if (isSensitivePathEntry(dir, f)) {
                        skippedSensitive++
                        return
                    }
                    if (isMinecraftHookTag(rel)) {
                        def kind = rel.endsWith('load.json') ? 'load' : 'tick'
                        def parsed
                        try {
                            parsed = slurper.parse(f)
                        } catch (Exception e) {
                            throw new GradleException("[mergeDatapacks] failed: ${packName}/${rel} is not valid JSON - ${e.message}")
                        }
                        def vals = (parsed instanceof Map && parsed.values instanceof List) ? parsed.values : []
                        vals.each { v -> ((kind == 'load') ? packLoadHooks : packTickHooks)[packName] << v.toString() }
                        if (parsed instanceof Map && parsed.replace == true) packReplaceFlags[packName] = true
                        if (gatedLoad) return // regenerated as the gated dispatcher below
                    }
                    relPathToSources.computeIfAbsent(rel) { [] } << [pack: packName, file: f]
                }
            }
        }
        println "[mergeDatapacks] collected ${relPathToSources.size()} distinct relative file path(s) across all included packs" +
                (skippedSensitive ? " (skipped ${skippedSensitive} sensitive/denylisted file(s))" : ".")
        if (gatedLoad) {
            packDirs.keySet().each { pn ->
                println "[mergeDatapacks] hooks for ${pn}: load=${packLoadHooks[pn].size()} ${packLoadHooks[pn] ? packLoadHooks[pn].join(', ') : '(none)'} | tick=${packTickHooks[pn].size()} ${packTickHooks[pn] ? packTickHooks[pn].join(', ') : '(none)'}"
            }
            def replaced = packReplaceFlags.findAll { it.value }.collect { it.key }
            if (replaced) {
                println "[mergeDatapacks] note: ${replaced.join(', ')} set \"replace\": true on minecraft load/tick tags - ignored in gated mode (generated tags are authoritative)."
            }
        }

        // Generated gatekeeper files live under data/<namespace>/ - refuse
        // to silently overwrite a pack that already ships that namespace.
        if (gatedLoad) {
            def coreCollisions = relPathToSources.keySet().findAll { it.startsWith("data/${coreNs}/") }
            if (coreCollisions) {
                def details = coreCollisions.sort().take(10).collect { "  - ${it}" }.join('\n')
                throw new GradleException(
                    "[mergeDatapacks] failed: included pack(s) already ship files under data/${coreNs}/, which collides " +
                    "with the generated gatekeeper:\n${details}\n" +
                    "Set a different manifest 'namespace' (e.g. \"vcm_merge\") and re-run."
                )
            }
        }

        // Paths where a tags/function(s)/*.json union-merge applies.
        def priorityIndex = priority.findAll { include.contains(it) }.withIndex().collectEntries { p, i -> [(p): i] }
        def hardCollisionRels = [] as Set
        def hardCollisions = []
        relPathToSources.each { rel, sources ->
            if (sources.size() > 1 && !isFunctionTagFile(rel)) {
                hardCollisionRels << rel
                def winner = sources.max { priorityIndex.containsKey(it.pack) ? -priorityIndex[it.pack] : -999999 }
                def note = prefixConflicts
                    ? "prefixed per-pack" + (priorityIndex ? "; ${winner.pack} is highest-priority" : "")
                    : "unresolved"
                hardCollisions << "${rel} (in: ${sources.collect { it.pack }.join(', ')}) [${note}]"
            }
        }
        if (hardCollisions && !prefixConflicts) {
            throw new GradleException(
                "[mergeDatapacks] failed: the following files exist in more than one included pack " +
                "and cannot be safely merged automatically:\n" +
                hardCollisions.collect { "  - ${it}" }.join('\n') +
                "\nResolve the conflict manually (rename/remove in one pack), set a 'priority' list, " +
                "or set \"prefixConflicts\": true in the manifest to ship every colliding version side by side."
            )
        }
        if (hardCollisions) {
            println "[mergeDatapacks] prefixConflicts=true: ${hardCollisions.size()} colliding path(s) will be namespaced per-pack instead of failing:"
            hardCollisions.each { println "[mergeDatapacks]   - ${it}" }
        }

        if (dryRun) {
            println "[mergeDatapacks] dry run OK: would merge ${packDirs.size()} pack(s) -> ${outDir}" +
                    (zipEnabled ? " + zip" : "") + ". ${relPathToSources.size()} file path(s), " +
                    "${hardCollisionRels.size()} collision(s) (${prefixConflicts ? 'prefixed' : 'none/blocking'}). No files written."
            return
        }

        // Write everything out.
        relPathToSources.each { rel, sources ->
            if (hardCollisionRels.contains(rel)) {
                // prefixConflicts mode: write each colliding pack's copy
                // under its own subfolder (data/<pack-id>__conflict/<rest>)
                // so nothing overwrites anything else. This deliberately
                // changes the file's effective path/namespace - conflicting
                // resource-location-bearing files (e.g. loot tables another
                // file points at by name) will need manual reference fixes;
                // this is a "ship it, don't silently drop it" escape hatch,
                // not a semantic merge.
                sources.each { src ->
                    def prefixedRel = "${vcSanitizePackId(src.pack)}__conflict/${rel}"
                    def outFile = new File(outDir, prefixedRel)
                    outFile.parentFile.mkdirs()
                    outFile.bytes = src.file.bytes
                }
                return
            }
            def outFile = new File(outDir, rel)
            outFile.parentFile.mkdirs()
            if (sources.size() == 1) {
                outFile.bytes = sources[0].file.bytes
            } else {
                // Union-merge tags/function(s) files by combining "values".
                def mergedValues = [] as LinkedHashSet
                def replaceFlag = false
                sources.each { src ->
                    def parsed = slurper.parse(src.file)
                    (parsed.values ?: []).each { mergedValues << it }
                    if (parsed.replace == true) {
                        replaceFlag = true
                    }
                }
                def mergedJson = groovy.json.JsonOutput.toJson([
                    replace: replaceFlag,
                    values : mergedValues.toList()
                ])
                outFile.text = groovy.json.JsonOutput.prettyPrint(mergedJson)
                println "[mergeDatapacks] merged ${rel} <- ${sources.collect { it.pack }.join(', ')} (${mergedValues.size()} value(s))"
            }
        }

        // ---- load-error handling, part 1 (build time): every load/tick
        // reference must resolve to a function/tag file in the merged
        // output, otherwise the hook silently does nothing in game. ----
        if (loadErrorHandling) {
            def funcsAvailable = [] as Set
            def tagsAvailable = [] as Set
            relPathToSources.keySet().each { rel ->
                def fm = (rel =~ /^data\/([^\/]+)\/functions?\/(.+)\.mcfunction$/)
                if (fm.matches()) funcsAvailable << "${fm.group(1)}:${fm.group(2)}".toString()
                def tm = (rel =~ /^data\/([^\/]+)\/tags\/functions?\/(.+)\.json$/)
                if (tm.matches()) tagsAvailable << "#${tm.group(1)}:${tm.group(2)}".toString()
            }
            def missingRefs = []
            def checkedTagFiles = [] as Set
            def checkRef
            checkRef = { String where, String refText, int depth ->
                if (refText.startsWith('#')) {
                    if (!tagsAvailable.contains(refText)) {
                        missingRefs << "${where}: tag '${refText}' has no tag file in the merged output"
                        return
                    }
                    // Depth-1: the referenced tag's own values must resolve too.
                    if (depth <= 0 || !checkedTagFiles.add(refText)) return
                    def inner = refText.substring(1).split(':', 2)
                    def tagRel = ["data/${inner[0]}/tags/function/${inner[1]}.json",
                                  "data/${inner[0]}/tags/functions/${inner[1]}.json"].find { relPathToSources.containsKey(it) }
                    if (tagRel) {
                        try {
                            def parsed = slurper.parse(relPathToSources[tagRel][0].file)
                            (parsed.values ?: []).each { v -> checkRef("${where} -> ${refText}", v.toString(), depth - 1) }
                        } catch (Exception ignored) { }
                    }
                } else if (!funcsAvailable.contains(refText)) {
                    missingRefs << "${where}: function '${refText}' has no .mcfunction file in the merged output"
                }
            }
            packDirs.keySet().each { pn ->
                packLoadHooks[pn].each { checkRef("${pn} [load]", it, 1) }
                packTickHooks[pn].each { checkRef("${pn} [tick]", it, 1) }
            }
            if (missingRefs) {
                def details = missingRefs.collect { "  - ${it}" }.join('\n')
                if (strictLoadRefs) {
                    throw new GradleException(
                        "[mergeDatapacks] failed: ${missingRefs.size()} load/tick reference(s) resolve to nothing in the merged output " +
                        "(these hooks would silently do nothing in game):\n${details}\n" +
                        "Fix the reference, include the pack that provides it, or set \"strictLoadRefs\": false to warn only."
                    )
                }
                missingRefs.each { println "[mergeDatapacks] WARNING: ${it}" }
            } else {
                println "[mergeDatapacks] load-reference check: all load/tick hooks resolve."
            }
        }

        // ---- gated load/tick gatekeeper generation ----
        // Per-pack URL-safe ids (storage paths, function paths, scoreboards).
        def packIds = [:]
        def usedIds = [] as Set
        packDirs.keySet().each { packName ->
            def base = vcSanitizePackId(packName)
            def id = base
            def n = 2
            while (usedIds.contains(id)) { id = "${base}_${n}".toString(); n++ }
            usedIds << id
            packIds[packName] = id
        }
        // Per-pack unload hooks (<ns>:unload when the pack ships one).
        def packUnloadHooks = [:]
        packDirs.each { packName, dir ->
            def dataRoot = new File(dir, 'data')
            def found = null
            if (dataRoot.exists()) {
                dataRoot.eachFile { nsDir ->
                    if (found != null || !nsDir.isDirectory()) return
                    ['function', 'functions'].each { fnDir ->
                        if (found == null && new File(nsDir, "${fnDir}/unload.mcfunction").exists()) {
                            found = "${nsDir.name}:unload"
                        }
                    }
                }
            }
            if (found != null) {
                packUnloadHooks[packName] = found
                println "[mergeDatapacks] unload hook for ${packName}: ${found}"
            }
        }

        def genStats = [count: 0]
        def writeGenerated = { String rel, String content ->
            def f = new File(outDir, rel)
            f.parentFile.mkdirs()
            f.text = content
            genStats.count++
        }
        // Templates use @TOKEN@ placeholders (NOT GStrings) so the literal
        // '$' macro prefix in api/report_error needs no escaping.
        def renderTemplate = { String template, Map bindings ->
            def out = template
            bindings.keySet().sort { -it.length() }.each { k ->
                out = out.replace("@${k}@", bindings[k].toString())
            }
            out
        }

        if (gatedLoad) {
            def cfgObj = "${coreNs}.cfg"
            def loadObj = "${coreNs}.load"
            def tag = coreNs.toUpperCase()
            def headerFor = { String rel -> "# ${rel} - generated by vortacraftmc/core mergeDatapacks (gatedLoad). Do not edit by hand; re-run ./gradlew mergeDatapacks." }
            def fakeOf = { String id -> ("${coreNs}_${id}").take(40) }
            def packDefaults = packDirs.keySet().collect { pn ->
                "execute unless data storage ${coreNs}:config packs.${packIds[pn]}.enabled run data modify storage ${coreNs}:config packs.${packIds[pn]}.enabled set value 1b"
            }.join('\n')
            def dispatch = packDirs.keySet().collect { pn ->
                "execute if data storage ${coreNs}:config {enabled:1b} if data storage ${coreNs}:config {packs:{${packIds[pn]}:{enabled:1b}}} run function ${coreNs}:packs/${packIds[pn]}/load"
            }.join('\n')
            def tickDispatch = packDirs.keySet().collect { pn ->
                "execute if data storage ${coreNs}:config {enabled:1b} if data storage ${coreNs}:config {packs:{${packIds[pn]}:{enabled:1b}}} run function ${coreNs}:packs/${packIds[pn]}/tick"
            }.join('\n')
            def packListEscaped = vcJsonEscape(packDirs.keySet().join(', '))
            def baseBindings = [CORE: coreNs, TAG: tag, CFG: cfgObj, LOAD: loadObj,
                                DEBUG: (debugDefault ? '1b' : '0b')]

            writeGenerated("data/${coreNs}/function/load.mcfunction", renderTemplate('''@HEADER@
#
# Master load dispatcher: calls every merged pack's original minecraft:load
# hook(s) through per-pack gates (storage @CORE@:config -> packs.<id>.enabled)
# plus one global gate ({enabled:1b}). Toggles survive /reload because
# defaults below are only written when missing.
#
#   Global kill-switch : function @CORE@:disable_all / @CORE@:enable_all
#   Per-pack toggle    : function @CORE@:packs/<id>/disable|enable
#   Debug messages     : function @CORE@:debug/on|off|toggle
#   Health report      : function @CORE@:status

scoreboard objectives add @CFG@ dummy
scoreboard objectives add @LOAD@ dummy

execute unless data storage @CORE@:config enabled run data modify storage @CORE@:config enabled set value 1b
execute unless data storage @CORE@:config debug run data modify storage @CORE@:config debug set value @DEBUG@
execute unless data storage @CORE@:errors log run data modify storage @CORE@:errors log set value []
@PACK_DEFAULTS@

@DISPATCH@

execute if data storage @CORE@:config {debug:1b} run tellraw @a ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"load complete: @NPACKS@ pack(s) gated (@PACKS@)","color":"gray"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/load.mcfunction"),
                      PACK_DEFAULTS: packDefaults, DISPATCH: dispatch,
                      NPACKS: packDirs.size().toString(), PACKS: packListEscaped]))

            writeGenerated("data/${coreNs}/function/tick.mcfunction", renderTemplate('''@HEADER@
#
# Master tick dispatcher: calls every merged pack's original minecraft:tick
# hook(s) through the same per-pack + global gates as load. When the global
# gate is off (function @CORE@:disable_all) every line below no-ops, so all
# merged packs effectively stop ticking.
@TICK_DISPATCH@
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/tick.mcfunction"),
                      TICK_DISPATCH: tickDispatch]))

            packDirs.keySet().each { pn ->
                def id = packIds[pn]
                def esc = vcJsonEscape(pn)
                def loadCalls = packLoadHooks[pn].collect { "function ${it}" }.join('\n')
                if (!loadCalls) loadCalls = "# (${pn} declares no minecraft:load hooks)"
                def tickCalls = packTickHooks[pn].collect { "function ${it}" }.join('\n')
                if (!tickCalls) tickCalls = "# (${pn} declares no minecraft:tick hooks)"
                def unloadCall = packUnloadHooks[pn] ? "function ${packUnloadHooks[pn]}" : "# (${pn} declares no <ns>:unload hook)"
                def packBindings = baseBindings + [ID: id, PACK: esc, FAKE: fakeOf(id)]

                writeGenerated("data/${coreNs}/function/packs/${id}/load.mcfunction", renderTemplate('''@HEADER@
#
# Gated load wrapper for "@PACK@" (original minecraft:load hooks).
# The @LOAD@ marker reads 0 while the hooks run and 1 once they return;
# function @CORE@:status reports it per pack.
scoreboard players set @FAKE@ @LOAD@ 0
@CALLS@
scoreboard players set @FAKE@ @LOAD@ 1
execute if data storage @CORE@:config {debug:1b} run tellraw @a ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"loaded @PACK@","color":"green"}]
''', packBindings + [HEADER: headerFor("data/${coreNs}/function/packs/${id}/load.mcfunction"), CALLS: loadCalls]))

                writeGenerated("data/${coreNs}/function/packs/${id}/tick.mcfunction", renderTemplate('''@HEADER@
#
# Gated tick wrapper for "@PACK@" (original minecraft:tick hooks).
@CALLS@
''', packBindings + [HEADER: headerFor("data/${coreNs}/function/packs/${id}/tick.mcfunction"), CALLS: tickCalls]))

                writeGenerated("data/${coreNs}/function/packs/${id}/enable.mcfunction", renderTemplate('''@HEADER@
#
# Enables "@PACK@" (re-runs its load wrapper so it re-initialises).
data modify storage @CORE@:config packs.@ID@.enabled set value 1b
tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"@PACK@ enabled","color":"green"}]
execute if data storage @CORE@:config {enabled:1b} run function @CORE@:packs/@ID@/load
''', packBindings + [HEADER: headerFor("data/${coreNs}/function/packs/${id}/enable.mcfunction")]))

                writeGenerated("data/${coreNs}/function/packs/${id}/disable.mcfunction", renderTemplate('''@HEADER@
#
# Disables "@PACK@" (its load/tick wrappers stop being dispatched).
@UNLOAD_CALL@
tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"@PACK@ disabled","color":"yellow"}]
''', packBindings + [HEADER: headerFor("data/${coreNs}/function/packs/${id}/disable.mcfunction"), UNLOAD_CALL: unloadCall]))

                writeGenerated("data/${coreNs}/function/packs/${id}/reload.mcfunction", renderTemplate('''@HEADER@
#
# Full reload cycle for "@PACK@": disable (runs its <ns>:unload hook if any)
# then immediately re-enable (re-runs its load wrapper). Equivalent to
# /function @CORE@:packs/@ID@/disable followed by /function @CORE@:packs/@ID@/enable,
# provided as one call for convenience when iterating on a single pack.
tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"reloading @PACK@...","color":"yellow"}]
function @CORE@:packs/@ID@/disable
function @CORE@:packs/@ID@/enable
''', packBindings + [HEADER: headerFor("data/${coreNs}/function/packs/${id}/reload.mcfunction")]))
            }

            if (killSwitch) {
                def unloadCalls = packDirs.keySet().collect { pn ->
                    packUnloadHooks[pn] ? "function ${packUnloadHooks[pn]}" : "# (${pn}: no <ns>:unload hook)"
                }.join('\n')
                writeGenerated("data/${coreNs}/function/enable_all.mcfunction", renderTemplate('''@HEADER@
#
# GLOBAL KILL-SWITCH (on): re-enables every merged pack and re-runs load.
data modify storage @CORE@:config enabled set value 1b
tellraw @a ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"all merged packs enabled","color":"green"}]
function @CORE@:load
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/enable_all.mcfunction")]))
                writeGenerated("data/${coreNs}/function/disable_all.mcfunction", renderTemplate('''@HEADER@
#
# GLOBAL KILL-SWITCH (off): stops every merged pack. Tick dispatch halts
# immediately; each known <ns>:unload hook runs once. Re-enable with:
#   function @CORE@:enable_all
data modify storage @CORE@:config enabled set value 0b
@UNLOAD_CALLS@
tellraw @a ["", {"text":"[@TAG@] ","color":"dark_red"}, {"text":"ALL merged packs disabled. Re-enable with /function @CORE@:enable_all","color":"red"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/disable_all.mcfunction"), UNLOAD_CALLS: unloadCalls]))
            }

            writeGenerated("data/${coreNs}/function/debug/on.mcfunction", renderTemplate('''@HEADER@
#
# Enables @TAG@ debug tellraws (storage @CORE@:config {debug:1b}).
data modify storage @CORE@:config debug set value 1b
tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"debug messages ON","color":"aqua"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/debug/on.mcfunction")]))
            writeGenerated("data/${coreNs}/function/debug/off.mcfunction", renderTemplate('''@HEADER@
#
# Disables @TAG@ debug tellraws (storage @CORE@:config {debug:0b}).
data modify storage @CORE@:config debug set value 0b
tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"debug messages OFF","color":"gray"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/debug/off.mcfunction")]))
            writeGenerated("data/${coreNs}/function/debug/toggle.mcfunction", renderTemplate('''@HEADER@
#
# Flips the @TAG@ debug flag (reads the old value into a score first so the
# two conditional writes below cannot fight each other).
execute unless data storage @CORE@:config debug run data modify storage @CORE@:config debug set value 0b
execute store result score #@CORE@_dbg @CFG@ run data get storage @CORE@:config debug
execute if score #@CORE@_dbg @CFG@ matches 1 run data modify storage @CORE@:config debug set value 0b
execute if score #@CORE@_dbg @CFG@ matches 0 run data modify storage @CORE@:config debug set value 1b
execute if data storage @CORE@:config {debug:1b} run tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"debug messages ON","color":"aqua"}]
execute unless data storage @CORE@:config {debug:1b} run tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"debug messages OFF","color":"gray"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/debug/toggle.mcfunction")]))

            def packStatus = packDirs.keySet().collect { pn ->
                def esc = vcJsonEscape(pn)
                def fake = fakeOf(packIds[pn])
                "execute if score ${fake} ${loadObj} matches 1 run tellraw @s [\"\", {\"text\":\"[OK] \",\"color\":\"green\"}, {\"text\":\"${esc}\",\"color\":\"white\"}]\n" +
                "execute if score ${fake} ${loadObj} matches 0 run tellraw @s [\"\", {\"text\":\"[..] \",\"color\":\"yellow\"}, {\"text\":\"${esc} (load started, not finished)\",\"color\":\"white\"}]\n" +
                "execute unless score ${fake} ${loadObj} matches 0..1 run tellraw @s [\"\", {\"text\":\"[--] \",\"color\":\"gray\"}, {\"text\":\"${esc} (not loaded)\",\"color\":\"gray\"}]"
            }.join('\n')
            def errorsHint = loadErrorHandling ? "\ntellraw @s [\"\", {\"text\":\"Errors: \",\"color\":\"gray\"}, {\"text\":\"run /function ${coreNs}:errors\",\"color\":\"yellow\"}]" : ''
            writeGenerated("data/${coreNs}/function/status.mcfunction", renderTemplate('''@HEADER@
#
# Health report: global gate, debug flag, and per-pack load markers.
tellraw @s ["", {"text":"=== @TAG@ status ===","color":"gold"}]
execute if data storage @CORE@:config {enabled:1b} run tellraw @s ["", {"text":"global: ","color":"gray"}, {"text":"ENABLED","color":"green"}]
execute unless data storage @CORE@:config {enabled:1b} run tellraw @s ["", {"text":"global: ","color":"gray"}, {"text":"DISABLED","color":"red"}]
execute if data storage @CORE@:config {debug:1b} run tellraw @s ["", {"text":"debug: ","color":"gray"}, {"text":"ON","color":"aqua"}]
execute unless data storage @CORE@:config {debug:1b} run tellraw @s ["", {"text":"debug: ","color":"gray"}, {"text":"OFF","color":"gray"}]
@PACK_STATUS@@ERRORS_HINT@
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/status.mcfunction"),
                      PACK_STATUS: packStatus, ERRORS_HINT: errorsHint]))

            // ---- load-error handling, part 2 (runtime): error log API ----
            if (loadErrorHandling) {
                writeGenerated("data/${coreNs}/function/api/report_error.mcfunction", renderTemplate('''@HEADER@
#
# Runtime error API (macro - needs MC 1.20.2+ to CALL; older games simply
# cannot run this one file, the rest of the pack is unaffected).
# Usage: function @CORE@:api/report_error {pack:"<id>",msg:"<what broke>"}
# Alerts every player and appends {pack,msg} to storage @CORE@:errors -> log.
$tellraw @a ["", {"text":"[@TAG@ ERROR] ","color":"red"}, {"text":"$(pack): ","color":"yellow"}, {"text":"$(msg)","color":"white"}]
$data modify storage @CORE@:errors log append value {pack:"$(pack)",msg:"$(msg)"}
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/api/report_error.mcfunction")]))
                writeGenerated("data/${coreNs}/function/errors.mcfunction", renderTemplate('''@HEADER@
#
# Prints the runtime error log (storage @CORE@:errors -> log).
tellraw @s ["", {"text":"=== @TAG@ error log ===","color":"gold"}]
tellraw @s ["", {"nbt":"log","storage":"@CORE@:errors","color":"white"}]
tellraw @s ["", {"text":"Clear with /function @CORE@:errors_clear","color":"gray"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/errors.mcfunction")]))
                writeGenerated("data/${coreNs}/function/errors_clear.mcfunction", renderTemplate('''@HEADER@
#
# Clears the runtime error log.
data modify storage @CORE@:errors log set value []
tellraw @s ["", {"text":"[@TAG@] ","color":"dark_gray"}, {"text":"error log cleared","color":"gray"}]
''', baseBindings + [HEADER: headerFor("data/${coreNs}/function/errors_clear.mcfunction")]))
            }

            // Generated minecraft entry-point tags (authoritative in gated mode).
            writeGenerated('data/minecraft/tags/function/load.json',
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([values: ["${coreNs}:load"]])))
            writeGenerated('data/minecraft/tags/function/tick.json',
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([values: ["${coreNs}:tick"]])))

            // Human-readable API cheat-sheet + machine-readable provenance.
            def readmeLines = []
            readmeLines << "Merged datapack - gated load/tick system (${coreNs})"
            readmeLines << 'Generated by vortacraftmc/core mergeDatapacks. Do not edit the generated files by hand;'
            readmeLines << 'change packs/merge-manifest.json (or the source packs) and re-run ./gradlew mergeDatapacks.'
            readmeLines << ''
            readmeLines << "Merged packs (${packDirs.size()}):"
            packDirs.keySet().each { pn -> readmeLines << "  - ${pn}  (id: ${packIds[pn]})" }
            readmeLines << ''
            readmeLines << 'Functions (run with /function <name>, cheats/op required):'
            readmeLines << "  ${coreNs}:load / ${coreNs}:tick      - entry points (called automatically)"
            readmeLines << "  ${coreNs}:status                    - global + per-pack load report"
            readmeLines << "  ${coreNs}:debug/on|off|toggle       - toggleable debug tellraws"
            if (loadErrorHandling) {
                readmeLines << "  ${coreNs}:api/report_error {pack,msg} - log a runtime error (MC 1.20.2+)"
                readmeLines << "  ${coreNs}:errors|errors_clear         - view / clear the error log"
            }
            readmeLines << "  ${coreNs}:packs/<id>/enable|disable|reload - per-pack toggle (ids: ${packIds.values().join(', ')})"
            if (killSwitch) {
                readmeLines << "  ${coreNs}:enable_all|disable_all     - GLOBAL kill-switch"
            }
            readmeLines << ''
            readmeLines << "Storage: ${coreNs}:config {enabled:1b, debug:1b/0b, packs:{<id>:{enabled:1b}}}"
            readmeLines << "         ${coreNs}:errors {log:[{pack,msg}, ...]}"
            readmeLines << "Scoreboards: ${cfgObj} (debug scratch), ${loadObj} (per-pack load markers 0/1)"
            writeGenerated("${coreNs.toUpperCase()}_README.txt", readmeLines.join('\n') + '\n')

            def provenance = [
                generator  : 'vortacraftmc/core mergeDatapacks',
                generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
                options    : [gatedLoad: gatedLoad, namespace: coreNs, debugDefault: debugDefault,
                               killSwitch: killSwitch, loadErrorHandling: loadErrorHandling,
                               strictLoadRefs: strictLoadRefs, allowMismatchedFormats: allowMismatchedFormats,
                               prefixConflicts: prefixConflicts, priority: priority.findAll { include.contains(it) }],
                packs      : packDirs.keySet().collect { pn ->
                    [name: pn, id: packIds[pn], format: formats[pn],
                     load: packLoadHooks[pn], tick: packTickHooks[pn],
                     unload: packUnloadHooks[pn]]
                }
            ]
            writeGenerated("${coreNs}_manifest.json",
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(provenance)))

            println "[mergeDatapacks] gated mode: generated ${genStats.count} ${coreNs} file(s) (load/tick dispatch, per-pack wrappers, debug, status" +
                    (killSwitch ? ', kill-switch' : '') + (loadErrorHandling ? ', error log API' : '') + ")."
        }

        // Write the merged pack.mcmeta from the manifest's "output" block.
        // pack_format is optional as of 25w31a (data pack format 82+ /
        // resource pack 65+); min_format+max_format are the required pair
        // for that range. Support whichever the manifest provides; fail if
        // neither is given. features.enabled is unioned across included
        // packs so experimental flags no pack can live without survive.
        def outPack = [description: output.description ?: "Merged datapack (${packDirs.keySet().join(', ')})"]
        if (output.pack_format != null) {
            outPack.pack_format = output.pack_format
        }
        if (output.min_format != null && output.max_format != null) {
            outPack.min_format = output.min_format
            outPack.max_format = output.max_format
        }
        if (output.pack_format == null && (output.min_format == null || output.max_format == null)) {
            throw new GradleException(
                "[mergeDatapacks] failed: manifest 'output' must declare either 'pack_format' " +
                "(pre-82/legacy) or both 'min_format' and 'max_format' (required for 82+)."
            )
        }
        def outMeta = [pack: outPack]
        def featuresEnabled = [] as LinkedHashSet
        metaCache.each { packName, meta ->
            (meta?.features?.enabled ?: []).each { featuresEnabled << it.toString() }
        }
        if (!featuresEnabled.isEmpty()) {
            outMeta.features = [enabled: featuresEnabled.toList()]
            println "[mergeDatapacks] unioned features.enabled: ${featuresEnabled.join(', ')}"
        }
        new File(outDir, 'pack.mcmeta').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(outMeta))

        // Distributable zip next to the exploded directory.
        if (zipEnabled) {
            def zipBase = (output.name ?: 'merged-datapack').toString().replaceAll('[^A-Za-z0-9_.-]+', '-').replaceAll('^-+|-+$', '')
            if (!zipBase) zipBase = 'merged-datapack'
            def zipFile = new File(buildDir, "${zipBase}.zip")
            println "[mergeDatapacks] writing ${zipFile}"
            zipDirectory(outDir, zipFile)
            println "[mergeDatapacks] OK: merged ${packDirs.size()} pack(s) -> ${outDir} + ${zipFile.name}"
        } else {
            println "[mergeDatapacks] OK: merged ${packDirs.size()} pack(s) -> ${outDir}"
        }
        println "[mergeDatapacks] included: ${packDirs.keySet().join(', ')}"

        if (reportPathProp) {
            def reportFile = new File(reportPathProp.toString()).with { it.isAbsolute() ? it : new File(reportProjectDir, it.path) }
            reportFile.parentFile?.mkdirs()
            // zip file name mirrors the sanitizing logic just above (and the
            // root 'build' task's own copy of it) rather than re-reading
            // manifest.output.name a second time, since 'output' is already
            // a plain local Map captured earlier in this doLast.
            def reportZipName = null
            if (zipEnabled) {
                def zb = (output.name ?: 'merged-datapack').toString().replaceAll('[^A-Za-z0-9_.-]+', '-').replaceAll('^-+|-+$', '')
                reportZipName = "${zb ?: 'merged-datapack'}.zip"
            }
            def report = [
                generatedAt       : new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
                manifest          : manifestDisplayPath,
                namespace         : coreNs,
                packsIncluded     : packDirs.keySet().toList(),
                packFormats       : formats,
                options           : [gatedLoad: gatedLoad, killSwitch: killSwitch, loadErrorHandling: loadErrorHandling,
                                     strictLoadRefs: strictLoadRefs, debugDefault: debugDefault,
                                     allowMismatchedFormats: allowMismatchedFormats, prefixConflicts: prefixConflicts,
                                     zip: zipEnabled],
                generatedFileCount: genStats.count,
                collisionCount    : hardCollisionRels.size(),
                outputDir         : outDir.path,
                zipFile           : reportZipName
            ]
            reportFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report))
            println "[mergeDatapacks] wrote report -> ${reportFile}"
        }
    }
}
// -----------------------------------------------------------------------
// 7. clean task extension
//
// The default 'clean' already deletes build/, but this makes sure the
// packs-dist/packs-remap cleanup happens explicitly and is logged,
// regardless of how a subproject overrides 'clean'.
// -----------------------------------------------------------------------
tasks.matching { it.name == 'clean' }.configureEach {
    // Captured at configuration time (configureEach's own closure body runs
    // during task realization/configuration, before any doLast runs) - see
    // the 'lint' task above for why 'file(...)' can't be called from inside
    // doLast itself.
    def packsDistDir = file('build/packs-dist')
    def packsRemapDir = file('build/packs-remap')
    def mergedDir = file('build/merged-datapack')
    def mergedZip = file('build/merged-datapack.zip')
    def distDir = file('build/dist')
    doLast {
        if (packsDistDir.exists()) {
            packsDistDir.deleteDir()
            println "[clean] removed build/packs-dist/"
        }
        if (packsRemapDir.exists()) {
            packsRemapDir.deleteDir()
            println "[clean] removed build/packs-remap/"
        }
        if (mergedDir.exists()) {
            mergedDir.deleteDir()
            println "[clean] removed build/merged-datapack/"
        }
        if (mergedZip.exists()) {
            mergedZip.delete()
            println "[clean] removed build/merged-datapack.zip"
        }
        if (distDir.exists()) {
            distDir.deleteDir()
            println "[clean] removed build/dist/"
        }
    }
}












































































































































































































































// verifyMod – monorepo-aware Fabric mod sanity check
task verifyMod {
    group = 'verification'
    description = 'Runs Fabric mod sanity checks across mods/ and examples/ (fabric.mod.json, mixins, duplicate ids).'

    doLast {
        List<String> errors = []
        List<String> warnings = []

        // Only look at source fabric.mod.json files, never build/ outputs
        def allModJsons = fileTree(dir: rootDir, include: [
            'mods/*/src/main/resources/fabric.mod.json',
            'examples/*/src/main/resources/fabric.mod.json'
        ]).files.findAll { f ->
            // Skip the two folders that settings.gradle already excludes
            !f.path.contains("${File.separator}datapack-fixer${File.separator}") &&
            !f.path.contains("${File.separator}RTWrapper${File.separator}rtwrapper-fabric${File.separator}")
        }

        if (allModJsons.isEmpty()) {
            println '[verifyMod] no fabric.mod.json found under mods/ or examples/ – nothing to check.'
            return
        }

        println "[verifyMod] checking ${allModJsons.size()} fabric.mod.json file(s)"

        def idsSeen = [:]

        allModJsons.each { modJsonFile ->
            def rel = rootDir.toPath().relativize(modJsonFile.toPath()).toString()
            def modJson
            try {
                modJson = new groovy.json.JsonSlurper().parse(modJsonFile)
            } catch (Exception e) {
                errors << "${rel}: invalid JSON – ${e.message}"
                return
            }

            // required fields
            ['schemaVersion', 'id', 'version', 'name'].each { field ->
                if (!modJson.containsKey(field)) {
                    errors << "${rel}: missing required field '${field}'"
                }
            }

            // duplicate id detection (source files only)
            if (modJson.id) {
                if (idsSeen.containsKey(modJson.id)) {
                    warnings << "Duplicate mod id '${modJson.id}' in:\n  - ${idsSeen[modJson.id]}\n  - ${rel}"
                } else {
                    idsSeen[modJson.id] = rel
                }
            }

            // entrypoints → source classes (warning only – templates often lack client classes)
            def entrypoints = modJson.entrypoints
            if (entrypoints instanceof Map) {
                def modRoot = modJsonFile.parentFile.parentFile.parentFile.parentFile // .../src/main/resources → mod root
                entrypoints.each { String key, value ->
                    (value instanceof List ? value : [value]).each { entry ->
                        String className = (entry instanceof Map) ? entry.value : entry?.toString()
                        if (className) {
                            String relPath = className.replace('.', '/') + '.java'
                            def javaFile = new File(modRoot, "src/main/java/${relPath}")
                            if (!javaFile.exists()) {
                                warnings << "${rel}: entrypoint '${key}' → '${className}' has no source at ${javaFile}"
                            }
                        }
                    }
                }
            }

            // mixin configs – warning only (TEMPLATE-MOD and similar stubs often omit them)
            def mixins = modJson.mixins
            if (mixins instanceof List) {
                mixins.each { m ->
                    String mixinPath = (m instanceof Map) ? m.config : m?.toString()
                    if (mixinPath) {
                        def mixinFile = new File(modJsonFile.parentFile, mixinPath)
                        if (!mixinFile.exists()) {
                            warnings << "${rel}: mixin config '${mixinPath}' not found"
                        }
                    }
                }
            }
        }

        // root build.gradle smells
        def rootBuild = file('build.gradle')
        if (rootBuild.exists()) {
            String text = rootBuild.text
            if (text.contains('mavenLocal()')) {
                warnings << "root build.gradle uses mavenLocal() – remove for reproducible CI builds"
            }
        }

        // Report
        println ''
        println '================ verifyMod report ================'
        if (warnings.isEmpty() && errors.isEmpty()) {
            println 'No issues found.'
        }
        warnings.each { println "WARN  ${it}\n" }
        errors.each { println "ERROR ${it}\n" }
        println "Summary: ${errors.size()} error(s), ${warnings.size()} warning(s)."
        println '====================================================='
        println ''

        // Only hard-fail on real errors (invalid JSON / missing required fields)
        if (!errors.isEmpty()) {
            throw new GradleException("verifyMod found ${errors.size()} error(s). See report above.")
        }
    }
}

// Root project has no Java plugin → no default 'check' task.
// maybeCreate makes ./gradlew check and the build lifecycle work.
tasks.maybeCreate('check').configure {
    group = 'verification'
    description = 'Runs suite-level verification tasks (including verifyMod).'
    dependsOn 'verifyMod'
}

// -----------------------------------------------------------------------
// 8. Root 'build' lifecycle task
//
// The root project also has no Java/base plugin applied, so - same as
// 'check' above - there is no 'build' task here unless we create one:
// './gradlew build' from the repo root would otherwise either fail with
// "task 'build' not found" or (if Gradle's own base lifecycle plugin is
// implicitly present) run as a no-op that never touches mergeDatapacks.
//
// This wires 'build' to run mergeDatapacks, then copies the merged
// datapack (the exploded build/merged-datapack/ dir, and its .zip if
// mergeDatapacks produced one) out of the transient build/ folder into
// build/dist/, so the result of 'gradle clean build' survives a future
// 'gradle clean' and is easy to find in one place. Subproject 'build'
// tasks (mods/, packs/, examples/) are untouched - Gradle's normal
// lifecycle wiring still makes ':subproject:build' run when you build
// the whole multi-project tree; this task only adds root-level behavior.
// -----------------------------------------------------------------------
tasks.maybeCreate('build').configure {
    group = 'build'
    description = "Runs mergeDatapacks and copies its output into build/dist/."
    dependsOn 'mergeDatapacks'
    def mergedDir = file('build/merged-datapack')
    def buildDir = file('build')
    def distDir = file('build/dist')
    // manifest.output.name mirrors the zip-naming logic inside
    // mergeDatapacks itself (section 6) so the copy step looks for the
    // exact zip name that task would have written, without re-parsing
    // the manifest a second time at execution time (Task.project access
    // during execution is deprecated - see the 'lint' task comment above
    // for why every value this doLast needs is captured here instead).
    def manifestFile = file('packs/merge-manifest.json')
    def zipBaseName = 'merged-datapack'
    if (manifestFile.exists()) {
        try {
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            def rawName = manifest?.output?.name
            if (rawName != null) {
                def sanitized = rawName.toString().replaceAll('[^A-Za-z0-9_.-]+', '-').replaceAll('^-+|-+$', '')
                if (sanitized) zipBaseName = sanitized
            }
        } catch (Exception ignored) {
            // mergeDatapacks itself will raise the real error for invalid
            // manifest JSON; this task only needs a best-effort zip name.
        }
    }
    doLast {
        if (!mergedDir.exists()) {
            println "[build] mergeDatapacks produced no build/merged-datapack/ (dry run, or task was up-to-date with nothing to copy) - skipping dist copy."
            return
        }
        if (distDir.exists()) {
            distDir.deleteDir()
        }
        distDir.mkdirs()
        def destDir = new File(distDir, 'merged-datapack')
        copyDirRecursive(mergedDir, destDir)
        println "[build] copied merged datapack -> ${destDir}"

        def zipFile = new File(buildDir, "${zipBaseName}.zip")
        if (zipFile.exists()) {
            def destZip = new File(distDir, zipFile.name)
            java.nio.file.Files.copy(zipFile.toPath(), destZip.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "[build] copied ${zipFile.name} -> ${destZip}"
        }
    }
}
