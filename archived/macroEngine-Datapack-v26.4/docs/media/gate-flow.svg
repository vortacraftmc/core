<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>macroEngine activation gate flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="760" height="330" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Activation gate (gate/v26_4)</text>

  <rect x="20" y="60" width="150" height="56" rx="8" fill="#eef2f7" stroke="#8c959f"/>
  <text x="95" y="82" text-anchor="middle" fill="#1f2328">/reload or server start</text>
  <text x="95" y="100" text-anchor="middle" fill="#57606a" font-size="11">load notice (ARCHIVED)</text>

  <rect x="230" y="60" width="150" height="56" rx="8" fill="#fff4d6" stroke="#bf8700"/>
  <text x="305" y="82" text-anchor="middle" fill="#1f2328" font-weight="bold">pending</text>
  <text x="305" y="100" text-anchor="middle" fill="#57606a" font-size="11">pack is inert</text>

  <rect x="440" y="60" width="150" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="515" y="82" text-anchor="middle" fill="#1f2328" font-weight="bold">active</text>
  <text x="515" y="100" text-anchor="middle" fill="#57606a" font-size="11">setup + tick run</text>

  <rect x="440" y="220" width="150" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="515" y="242" text-anchor="middle" fill="#1f2328" font-weight="bold">locked</text>
  <text x="515" y="260" text-anchor="middle" fill="#57606a" font-size="11">tick, load, sinks off</text>

  <line x1="170" y1="88" x2="228" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="88" x2="438" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="409" y="78" text-anchor="middle" fill="#57606a" font-size="11">confirm</text>

  <line x1="515" y1="116" x2="515" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="525" y="160" fill="#57606a" font-size="11">lock</text>
  <text x="525" y="176" fill="#57606a" font-size="11">&gt;5 reloads / 200 ticks</text>

  <path d="M440 248 H305 V118" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="240" text-anchor="middle" fill="#57606a" font-size="11">unlock</text>

  <text x="20" y="150" fill="#1f2328" font-size="12" font-weight="bold">Operator steps</text>
  <text x="20" y="170" fill="#1f2328" font-size="12" font-family="Consolas, monospace">/tag &lt;you&gt; add macroengine.gate_admin</text>
  <text x="20" y="190" fill="#1f2328" font-size="12" font-family="Consolas, monospace">/function macroengine:gate/v26_4/confirm {format:122}</text>
  <text x="20" y="210" fill="#57606a" font-size="11">Confirm is bound to pack version v26.4-snapshot-1 and format 122.</text>
  <text x="20" y="280" fill="#57606a" font-size="11">After a confirmed version, later reloads go straight to active (unless locked).</text>
  <text x="20" y="300" fill="#57606a" font-size="11">Console and command blocks need no tag; players do.</text>
</svg>
