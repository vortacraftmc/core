<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>macroEngine layers</title>
  <rect width="760" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">macroEngine layers (namespace: macroengine)</text>

  <rect x="30" y="46" width="700" height="46" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="380" y="66" text-anchor="middle" font-weight="bold" fill="#1f2328">api/  (public entry points)</text>
  <text x="380" y="83" text-anchor="middle" font-size="11" fill="#57606a">cmd, cb, color, gamerule, interaction, item, macro, perm, title, toggle, trigger, wand</text>

  <rect x="30" y="104" width="340" height="62" rx="8" fill="#fbefff" stroke="#8250df"/>
  <text x="200" y="125" text-anchor="middle" font-weight="bold" fill="#1f2328">systems/</text>
  <text x="200" y="143" text-anchor="middle" font-size="11" fill="#57606a">math, string, nbt, logic, geo, flag, hook,</text>
  <text x="200" y="157" text-anchor="middle" font-size="11" fill="#57606a">log, rate_limit, sound, uuid, color</text>

  <rect x="390" y="104" width="340" height="62" rx="8" fill="#fff8c5" stroke="#bf8700"/>
  <text x="560" y="125" text-anchor="middle" font-weight="bold" fill="#1f2328">input/</text>
  <text x="560" y="143" text-anchor="middle" font-size="11" fill="#57606a">book, sign, lectern, name tag, minecart</text>
  <text x="560" y="157" text-anchor="middle" font-size="11" fill="#57606a">raw capture + input/validate/check</text>

  <rect x="30" y="178" width="700" height="46" rx="8" fill="#eef2f7" stroke="#8c959f"/>
  <text x="380" y="198" text-anchor="middle" font-weight="bold" fill="#1f2328">core/  (internal: tick dispatch, load, config, state, text module)</text>
  <text x="380" y="215" text-anchor="middle" font-size="11" fill="#57606a">tick: time / player / queue every tick, hud every 2, admin every 4</text>

  <rect x="30" y="236" width="700" height="46" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="380" y="256" text-anchor="middle" font-weight="bold" fill="#1f2328">load / tick entry points</text>
  <text x="380" y="273" text-anchor="middle" font-size="11" fill="#57606a">everything above stays inert until state = active</text>
</svg>
