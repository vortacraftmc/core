// build.gradle for packs/macroEngine-Datapack-v26.3
// Local zip packaging only; publishing to GitHub is handled separately.

plugins {
    id 'base'
}

def packDir = projectDir
def distDir = layout.buildDirectory.dir('dist')

tasks.register('zipMacroEnginePack', Zip) {
    group = 'build'
    description = 'Zips this datapack folder (data/, pack.mcmeta, pack.png, README.md) into a distributable archive.'
    archiveFileName.set('macroEngine-Datapack-v26.3.zip')
    destinationDirectory.set(distDir)

    from(packDir) {
        include 'data/**'
        include 'pack.mcmeta'
        include 'pack.png'
        include 'README.md'
    }
}
