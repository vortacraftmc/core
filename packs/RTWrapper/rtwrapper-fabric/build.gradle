plugins {
    id 'fabric-loom' version '1.10.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// processResources' fabric.mod.json version expansion, withSourcesJar(), and
// the mavenJava publication are identical across mods/ (and this excluded-
// but-kept-for-reference pack, see settings.gradle's EXCLUDED_PROJECT_DIRS
// entry for it) - see build-logic/shared-fabric-mod.gradle for what this
// pulls in and why it's `apply from:` rather than a precompiled plugin. A
// projectDir-relative path is used (not ${rootDir}) so this also resolves
// correctly when built standalone via this project's own settings.gradle,
// where rootDir would point here instead of at vortacraftmc/core's root.
// One extra `../` versus mods/*/build.gradle's copy of this line, since this
// project sits one directory deeper (packs/RTWrapper/rtwrapper-fabric).
apply from: "${projectDir}/../../../build-logic/shared-fabric-mod.gradle"
