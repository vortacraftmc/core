# Keeps GitHub Actions, Gradle, Docker, and Python (pip) dependencies up to date via PRs.
# Packs under packs/ are locked by datapack-immutability.yml and contain no
# ecosystem manifests Dependabot would touch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Pip (Python) bağımlılık güncellemeleri. The only requirements.txt /
  # pyproject.toml in the tree live in scripts/gui_generator, so "/" never
  # matched anything.
  - package-ecosystem: "pip"
    directory: "/scripts/gui_generator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # npm: scripts/dpgen has a package.json + lockfile that no other entry covers.
  - package-ecosystem: "npm"
    directory: "/scripts/dpgen"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
