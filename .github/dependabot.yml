# Keeps GitHub Actions, Gradle, Docker, and Python (pip) dependencies up to date via PRs.
# Packs under packs/ are locked by datapack-immutability.yml and contain no
# ecosystem manifests Dependabot would touch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Pip (Python) bağımlılık güncellemeleri
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5