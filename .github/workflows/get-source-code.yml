name: Source Code (with Git History)

# AUDIT: this used to run on every push, with no branch/path filter, and
# bundled the full .git history into a downloadable artifact. If any commit
# in the repo's history ever contained a secret (even one later removed),
# this workflow packaged and published it as an Actions artifact on every
# single push, to anyone with read access to Actions artifacts. Restricted
# to manual runs only -- run it deliberately when a full-history export is
# actually needed, not automatically on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          rsync -a \
            --exclude=archive \
            --exclude=.github \
            --exclude=.git \
            ./ archive/
          cp -a .git archive/
      - name: Create ZIP
        run: |
          cd archive
          zip -r ../source-with-history.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-code
          path: source-with-history.zip
