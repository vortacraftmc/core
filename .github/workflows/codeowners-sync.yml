# .github/workflows/codeowners-sync.yml
name: CODEOWNERS Sync

on:
  workflow_dispatch:
  # Maintenance pause (2026-10-04, expected until at least 2027-2028): the weekly schedule is
  # off so no unattended bot PRs are opened and no ORG_READ_TOKEN use is needed. Run it by hand
  # (workflow_dispatch) or restore the lines below when maintenance resumes.
  # schedule:
  #   - cron: "0 6 * * 1" # Weekly, Monday

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch members and generate CODEOWNERS
        env:
          # Fine-grained PAT or GitHub App token.
          # The token must be able to read organization members.
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: vortacraftmc
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking GitHub authentication..."

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ORG_READ_TOKEN secret is missing or empty."
            exit 1
          fi

          if ! gh api user --jq '.login' >/tmp/gh-user 2>/tmp/gh-user-error; then
            echo "::error::GH_TOKEN authentication failed."
            cat /tmp/gh-user-error
            exit 1
          fi

          GH_USER="$(cat /tmp/gh-user)"

          if [ -z "$GH_USER" ]; then
            echo "::error::GitHub API returned an empty authenticated user."
            exit 1
          fi

          echo "Authenticated as: $GH_USER"

          echo "Fetching organization members..."

          members_file="$(mktemp)"

          if ! gh api \
            --paginate \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "orgs/${ORG}/members" \
            --jq '.[].login' \
            > "$members_file" 2>/tmp/gh-members-error; then

            echo "::error::Failed to fetch members of organization '${ORG}'."
            cat /tmp/gh-members-error
            rm -f "$members_file"
            exit 1
          fi

          # Remove empty lines and duplicates.
          sed -i '/^[[:space:]]*$/d' "$members_file"
          sort -u "$members_file" -o "$members_file"

          if [ ! -s "$members_file" ]; then
            echo "::error::GitHub returned an empty member list for '${ORG}'."
            echo "::error::Check that ORG_READ_TOKEN has organization-member read access."
            echo "::error::Also verify that the token belongs to an account/app allowed to see the organization's members."
            rm -f "$members_file"
            exit 1
          fi

          member_count="$(wc -l < "$members_file" | tr -d ' ')"

          echo "Found ${member_count} organization member(s)."

          # Convert:
          # alice
          # bob
          # charlie
          #
          # into:
          # @alice @bob @charlie
          owners="$(
            sed 's/^/@/' "$members_file" |
            paste -sd ' ' -
          )"

          if [ -z "$owners" ]; then
            echo "::error::Failed to generate CODEOWNERS owners."
            rm -f "$members_file"
            exit 1
          fi

          echo "Generating .github/CODEOWNERS..."

          mkdir -p .github

          cat > .github/CODEOWNERS <<EOF
          # This file is generated by the codeowners-sync workflow.
          # Do not edit this file manually.

          /packs/.datapack-lock.json $owners
          /packs/*/data/*/function/_vc_origin.mcfunction $owners
          /packs/*/data/*/functions/_vc_origin.mcfunction $owners
          .github/CODEOWNERS $owners
          .github/workflows/ $owners
          EOF

          # Remove YAML heredoc indentation.
          sed -i 's/^          //' .github/CODEOWNERS

          rm -f "$members_file"

          echo "Generated CODEOWNERS:"
          echo "----------------------------------------"
          cat .github/CODEOWNERS
          echo "----------------------------------------"

      - name: Validate CODEOWNERS
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s .github/CODEOWNERS ]; then
            echo "::error::.github/CODEOWNERS was not generated."
            exit 1
          fi

          if ! grep -q '^/packs/\.datapack-lock\.json ' .github/CODEOWNERS; then
            echo "::error::CODEOWNERS is missing the datapack lock rule."
            exit 1
          fi

          if ! grep -q '^\.github/workflows/ ' .github/CODEOWNERS; then
            echo "::error::CODEOWNERS is missing the workflow rule."
            exit 1
          fi

          echo "CODEOWNERS validation passed."

      - name: Open PR (no merge)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/CODEOWNERS; then
            echo "No CODEOWNERS changes."
            exit 0
          fi

          git config user.name "codeowners-sync[bot]"
          git config user.email "codeowners-sync@users.noreply.github.com"

          git checkout -B chore/codeowners-sync

          git add .github/CODEOWNERS

          git commit -m "chore: update CODEOWNERS owner list"

          git push --force-with-lease origin chore/codeowners-sync

          # Do not create a duplicate PR if one already exists.
          existing_pr="$(
            gh pr list \
              --base main \
              --head chore/codeowners-sync \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$existing_pr" ]; then
            echo "Existing CODEOWNERS PR: #$existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head chore/codeowners-sync \
            --title "chore: update CODEOWNERS owner list" \
            --body "Auto-generated. The CODEOWNERS list was synchronized from the members of the vortacraftmc organization. Please review and merge this PR."
