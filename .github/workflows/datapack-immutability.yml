name: Datapack Immutability Check

# Blocks PRs that modify files under packs/<name>/ when that pack is
# marked "locked": true in packs/.datapack-lock.json on the *base* branch.
#
# Deliberately NOT using pull_request_target: read-only diff check, no secrets,
# no elevated base-branch token against untrusted PR content.
#
# Both the lock file AND the checker script are loaded from the base branch,
# so a PR cannot unlock a pack or neuter the checker in the same change.
#
# No `paths:` filter on purpose: if this is a required status check, a
# path-filtered workflow never reports on unrelated PRs and blocks the merge.
# The diff step below already handles the "nothing changed under packs/" case.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: datapack-immutability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-lock:
    name: Block locked datapack edits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Full history is already present (fetch-depth: 0); no --depth here,
          # a shallow fetch could truncate history and break the merge-base.
          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            echo "ERROR: origin/${BASE_REF} not available after fetch" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: List pack files changed vs base
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Three-dot: changes on the PR side since merge-base with base.
          # --no-renames: report both old and new paths, so moving a file
          # out of a locked pack cannot hide the original location.
          # core.quotepath=false: keep non-ASCII names unquoted.
          git -c core.quotepath=false diff --name-only --no-renames \
            "origin/${BASE_REF}...HEAD" -- packs/ \
            | sort -u > "$RUNNER_TEMP/changed_pack_files.txt"
          echo "Changed paths under packs/:"
          if [ ! -s "$RUNNER_TEMP/changed_pack_files.txt" ]; then
            echo "(none)"
          else
            cat "$RUNNER_TEMP/changed_pack_files.txt"
          fi
          echo "count=$(wc -l < "$RUNNER_TEMP/changed_pack_files.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Load lock file and checker from base
        if: steps.diff.outputs.count != '0'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Evaluate lock status and checker logic from BASE, not PR head:
          # prevents "unlock + edit in one PR" and "edit the checker" bypasses.
          for f in packs/.datapack-lock.json scripts/datapack_lock/check_lock.py; do
            if ! git cat-file -e "origin/${BASE_REF}:${f}" 2>/dev/null; then
              echo "ERROR: ${f} missing on origin/${BASE_REF}" >&2
              exit 1
            fi
          done
          git show "origin/${BASE_REF}:packs/.datapack-lock.json" \
            > "$RUNNER_TEMP/base-datapack-lock.json"
          git show "origin/${BASE_REF}:scripts/datapack_lock/check_lock.py" \
            > "$RUNNER_TEMP/check_lock.py"
          echo "Base lock file:"
          cat "$RUNNER_TEMP/base-datapack-lock.json"

      # --- v2 additions below: every step above this line is unchanged. ---
      # These three steps only *collect data* (git log, PR label context,
      # file content) -- check_lock.py itself still never calls git or the
      # GitHub API. Each new check only activates if its corresponding
      # check_lock.py flag is given real content; an empty commit list or
      # an empty label list is a safe no-op for the ai_write_locked check,
      # not a false failure.

      - name: Collect commit actor metadata (for ai_write_locked)
        if: steps.diff.outputs.count != '0'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git log --no-merges \
            --format='%H%x1f%an%x1f%ae%x1f%cn%x1f%ce%x1f%(trailers:only=true,unfold=true,separator=%x1e)%x1d' \
            "origin/${BASE_REF}..HEAD" > "$RUNNER_TEMP/commit_log.raw"
          python3 - "$RUNNER_TEMP/commit_log.raw" "$RUNNER_TEMP/commit_actors.json" <<'PY'
          import json
          import sys

          raw = open(sys.argv[1], encoding="utf-8").read()
          out = []
          for rec in filter(None, raw.split("\x1d")):
              # git inserts its own "\n" between each formatted commit's
              # output and the next one; since that lands right after our
              # own %x1d separator, it shows up as a leading newline on
              # every record except the first. Strip it before splitting.
              fields = rec.strip("\n").split("\x1f")
              if len(fields) < 6:
                  continue
              sha, an, ae, cn, ce, trailers = fields[:6]
              out.append(
                  {
                      "sha": sha,
                      "author_name": an,
                      "author_email": ae,
                      "committer_name": cn,
                      "committer_email": ce,
                      "trailers": [t for t in trailers.split("\x1e") if t.strip()],
                  }
              )
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
          PY

      - name: Dump PR labels (for ai_write_locked)
        if: steps.diff.outputs.count != '0'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: echo "$LABELS_JSON" > "$RUNNER_TEMP/pr_labels.json"

      - name: Mirror changed pack file content (for injection scan)
        if: steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/content"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$RUNNER_TEMP/content/$(dirname "$f")"
            git show "HEAD:$f" > "$RUNNER_TEMP/content/$f" 2>/dev/null || true
          done < "$RUNNER_TEMP/changed_pack_files.txt"

      - name: Enforce locked datapacks + AI guardrails (block)
        if: steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t pr_labels < <(python3 -c "
          import json
          print('\n'.join(json.load(open('$RUNNER_TEMP/pr_labels.json'))))
          ")
          label_args=()
          for l in "${pr_labels[@]}"; do
            [ -n "$l" ] && label_args+=(--pr-label "$l")
          done

          # .claudeignore / .cursorignore / .aiexclude are optional -- only
          # pass the ones that actually exist in this repo, and skip the
          # flag entirely (rather than passing it with zero paths, which
          # argparse would reject) if none do.
          ignore_paths=()
          for f in .claudeignore .cursorignore .aiexclude; do
            [ -f "$f" ] && ignore_paths+=("$f")
          done
          ignore_flag=()
          if [ "${#ignore_paths[@]}" -gt 0 ]; then
            ignore_flag=(--ai-ignore-files "${ignore_paths[@]}")
          fi

          python3 "$RUNNER_TEMP/check_lock.py" \
            "$RUNNER_TEMP/base-datapack-lock.json" \
            --from-file "$RUNNER_TEMP/changed_pack_files.txt" \
            --commit-actors-json "$RUNNER_TEMP/commit_actors.json" \
            "${label_args[@]}" \
            "${ignore_flag[@]}" \
            --content-dir "$RUNNER_TEMP/content" \
            --step-summary "$GITHUB_STEP_SUMMARY"
