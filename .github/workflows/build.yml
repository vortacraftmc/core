name: CI

on:
  push:
    branches: [main, master, devlop, test]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the `release` job below gets
# contents: write, and it never checks out or runs repository code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ==================================================================
  # PYTHON: guigenmc generator
  # ==================================================================
  python-ci:
    name: guigenmc • ${{ matrix.os }} • Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    env:
      FORCE_COLOR: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7
        with:
          # Required for the optional source-with-history archive.
          fetch-depth: 0
          # The archive step copies .git wholesale; do not leave the
          # GITHUB_TOKEN inside it.
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          set -euo pipefail

          echo "::group::🔧 Environment"
          trap 'echo "::endgroup::"' EXIT

          CYAN='\033[1;36m'
          RESET='\033[0m'

          printf "${CYAN}Runner:${RESET} %s\n" "$RUNNER_OS"
          printf "${CYAN}Python:${RESET} %s\n" "${{ matrix.python-version }}"
          printf "${CYAN}Repository:${RESET} %s\n" "$GITHUB_REPOSITORY"
          printf "${CYAN}Ref:${RESET} %s\n" "$GITHUB_REF"
          printf "${CYAN}Commit:${RESET} %s\n" "$GITHUB_SHA"

          python --version
          pip --version

      - name: Install guigenmc
        run: |
          set -euo pipefail

          echo "::group::📦 Install guigenmc"
          trap 'echo "::endgroup::"' EXIT

          pip install -e ./scripts/gui_generator

      - name: Write minimal config
        run: |
          set -euo pipefail

          echo "::group::📝 Create Test Configuration"
          trap 'echo "::endgroup::"' EXIT

          cat > menu.json << 'JSON'
          {
            "namespace": "demo",
            "menu_id": "shop",
            "pages": [
              {
                "index": 0,
                "name": "Main",
                "widgets": [
                  {
                    "kind": "button",
                    "slot": 13,
                    "item": "minecraft:diamond",
                    "name": {
                      "text": "Get Diamond",
                      "color": "aqua"
                    },
                    "commands": [
                      "give @s minecraft:diamond 1"
                    ]
                  },
                  {
                    "kind": "close",
                    "slot": 26
                  }
                ]
              }
            ]
          }
          JSON

          python -m json.tool menu.json >/dev/null

          printf '\033[1;32m✔ menu.json created and validated\033[0m\n'

      - name: Generate datapack folder
        id: generate-folder
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::🎮 Generate Datapack Folder"
          trap 'echo "::endgroup::"' EXIT

          if ! guigenmc generate menu.json -f; then
            printf '\033[1;31m✘ Folder generation failed\033[0m\n'
            echo "::error title=Folder generation failed::guigenmc generate -f failed"
            exit 1
          fi

          test -f shop_datapack/pack.mcmeta
          test -f shop_datapack/data/demo/function/core/load.mcfunction

          printf '\033[1;32m✔ Datapack folder generated and checked\033[0m\n'

      - name: Generate zip and validate
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::📦 Generate ZIP + Validate + Tree"
          trap 'echo "::endgroup::"' EXIT

          if ! guigenmc generate menu.json -z -f -o shop.zip; then
            printf '\033[1;31m✘ ZIP generation failed\033[0m\n'
            echo "::error title=ZIP generation failed::guigenmc generate -z failed."
            exit 1
          fi

          test -s shop.zip

          if ! guigenmc validate menu.json; then
            printf '\033[1;31m✘ Validation failed\033[0m\n'
            echo "::error title=GUI validation failed::guigenmc validate failed."
            exit 1
          fi

          echo "::group::🌳 Generated Tree"
          guigenmc tree menu.json
          echo "::endgroup::"

          printf '\033[1;32m✔ ZIP generation and validation passed\033[0m\n'

      - name: Verify UI static files
        id: static-ui
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::🖥️ UI Static Files"
          trap 'echo "::endgroup::"' EXIT

          static_file="$(
            python -c \
              "import guigenmc, pathlib; print(pathlib.Path(guigenmc.__file__).parent / 'static' / 'index.html')"
          )"

          echo "Expected: $static_file"

          if [ ! -f "$static_file" ]; then
            echo "::error title=Missing UI static file::static/index.html was not found."
            exit 1
          fi

          printf '\033[1;32m✔ UI static index.html exists\033[0m\n'

      - name: Build sdist and wheel
        id: package
        continue-on-error: true
        working-directory: ./scripts/gui_generator
        run: |
          set -euo pipefail

          echo "::group::🐍 Python Package :: sdist + wheel"
          trap 'echo "::endgroup::"' EXIT

          pip install build twine

          python -m build
          python -m twine check dist/*

          # The editable install always sees static/ in the source tree;
          # this checks that the built wheel actually ships it.
          python - << 'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("No wheel was built")
          names = zipfile.ZipFile(wheels[0]).namelist()
          if not any(n.endswith("static/index.html") for n in names):
              sys.exit("Wheel is missing static/index.html")
          PY

          printf '\033[1;32m✔ sdist/wheel build, twine check and wheel contents passed\033[0m\n'

      - name: Upload generated datapack
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datapack-${{ matrix.os }}-py${{ matrix.python-version }}
          path: shop.zip
          if-no-files-found: ignore
          retention-days: 3

      # Source + Git history archive: manual runs only, ONE matrix
      # combination. Never produced on push/pull_request.
      - name: Create source archive with Git history
        id: source-archive
        if: >
          github.event_name == 'workflow_dispatch' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        run: |
          set -euo pipefail

          echo "::group::📚 Source Archive :: full Git history"
          trap 'echo "::endgroup::"' EXIT

          YELLOW='\033[1;33m'
          GREEN='\033[1;32m'
          RESET='\033[0m'

          printf "${YELLOW}⚠ Creating an archive containing .git history.${RESET}\n"
          printf "${YELLOW}⚠ This may contain historical secrets that were removed later.${RESET}\n"

          mkdir -p archive

          rsync -a \
            --exclude=archive \
            --exclude=.github \
            --exclude=.git \
            ./ archive/

          cp -a .git archive/

          printf "${GREEN}✔ Source tree copied${RESET}\n"
          printf "${GREEN}✔ .git history copied${RESET}\n"

      - name: Create source ZIP
        id: source-zip
        if: >
          github.event_name == 'workflow_dispatch' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::🗜️ Source ZIP"
          trap 'echo "::endgroup::"' EXIT

          cd archive
          zip -qr ../source-with-history.zip .
          cd ..

          test -s source-with-history.zip

          printf '\033[1;32m✔ source-with-history.zip created\033[0m\n'
          ls -lh source-with-history.zip

      - name: Upload source archive
        if: >
          github.event_name == 'workflow_dispatch' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: source-code-with-history
          path: source-with-history.zip
          if-no-files-found: error
          retention-days: 3

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          echo "::group::🔎 Diagnostics"
          trap 'echo "::endgroup::"' EXIT

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          CYAN='\033[1;36m'
          RESET='\033[0m'

          generate_result="${{ steps.generate-folder.outcome }}"
          validate_result="${{ steps.validate.outcome }}"
          static_result="${{ steps.static-ui.outcome }}"
          package_result="${{ steps.package.outcome }}"

          printf "${CYAN}Folder generation:${RESET} %s\n" "$generate_result"
          printf "${CYAN}Validation:${RESET} %s\n" "$validate_result"
          printf "${CYAN}Static UI:${RESET} %s\n" "$static_result"
          printf "${CYAN}Package build:${RESET} %s\n" "$package_result"

          echo "::group::Generated files"
          find . \
            -maxdepth 4 \
            -type f \
            \( -name '*.zip' -o -name '*.whl' -o -name '*.tar.gz' \) \
            -print 2>/dev/null | sort
          echo "::endgroup::"

          echo "::group::Git status"
          git status --short
          echo "::endgroup::"

          if [ "$generate_result" = "success" ] &&
             [ "$validate_result" = "success" ] &&
             [ "$static_result" = "success" ] &&
             [ "$package_result" = "success" ]; then
            printf "${GREEN}✔ All guigenmc checks passed${RESET}\n"
          else
            printf "${RED}✘ One or more guigenmc checks failed${RESET}\n"
          fi

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          set +e

          echo "::group::📊 CI Summary"
          trap 'echo "::endgroup::"' EXIT

          generate_result="${{ steps.generate-folder.outcome }}"
          validate_result="${{ steps.validate.outcome }}"
          static_result="${{ steps.static-ui.outcome }}"
          package_result="${{ steps.package.outcome }}"

          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          {
            echo "# 🧪 guigenmc CI Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Datapack generation | $(icon "$generate_result") \`$generate_result\` |"
            echo "| ZIP + validation | $(icon "$validate_result") \`$validate_result\` |"
            echo "| UI static files | $(icon "$static_result") \`$static_result\` |"
            echo "| Python package | $(icon "$package_result") \`$package_result\` |"
            echo ""
            echo "## Environment"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| OS | \`${{ matrix.os }}\` |"
            echo "| Python | \`${{ matrix.python-version }}\` |"
            echo "| Ref | \`$GITHUB_REF\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$generate_result" != "success" ] ||
             [ "$validate_result" != "success" ] ||
             [ "$static_result" != "success" ] ||
             [ "$package_result" != "success" ]; then
            echo "::error title=guigenmc CI failed::One or more checks failed."
            exit 1
          fi

  # ==================================================================
  # GRADLE: build + lint (read-only token)
  # ==================================================================
  build-lint:
    name: Build • Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish: ${{ steps.release-gate.outputs.PUBLISH }}

    env:
      FORCE_COLOR: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runner
        run: |
          set -euo pipefail

          echo "::group::🔧 Runner Preparation"
          trap 'echo "::endgroup::"' EXIT

          chmod +x ./gradlew

          printf '\033[1;36m%s\033[0m\n' "Runner: $RUNNER_NAME"
          printf '\033[1;36m%s\033[0m\n' "OS: $RUNNER_OS"
          printf '\033[1;36m%s\033[0m\n' "Java:"
          java -version

          printf '\033[1;36m%s\033[0m\n' "Gradle:"
          ./gradlew --version

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"

      - name: Build all subprojects
        id: build
        continue-on-error: true
        run: |
          set -uo pipefail

          GREEN='\033[1;32m'
          CYAN='\033[1;36m'
          RED='\033[1;31m'
          RESET='\033[0m'

          echo "::group::🏗️ Build :: buildAll + build"
          trap 'echo "::endgroup::"' EXIT

          printf "${CYAN}▶ Running buildAll + build (-PconfirmZip=yes)${RESET}\n"

          ./gradlew buildAll build --continue -PconfirmZip=yes
          rc=$?

          if [ "$rc" -eq 0 ]; then
            printf "${GREEN}✔ Build completed successfully${RESET}\n"
          else
            printf "${RED}✘ Build failed with exit code %s${RESET}\n" "$rc"
            echo "::error title=Build failed::Gradle buildAll/build exited with code $rc"
          fi

          exit "$rc"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: |
            mods/**/build/libs/*.jar
            examples/**/build/libs/*.jar
            build/packs-dist/*.zip
            build/dist/**
          if-no-files-found: ignore
          # 90 is the maximum for public repositories.
          retention-days: 90

      - name: Gradle lint
        id: gradle-lint
        continue-on-error: true
        run: |
          set -uo pipefail

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          RESET='\033[0m'

          echo "::group::🧹 Gradle Lint"
          trap 'echo "::endgroup::"' EXIT

          ./gradlew lint --continue
          rc=$?

          if [ "$rc" -eq 0 ]; then
            printf "${GREEN}✔ Gradle lint passed${RESET}\n"
          else
            printf "${RED}✘ Gradle lint failed with exit code %s${RESET}\n" "$rc"
            echo "::error title=Gradle lint failed::lint --continue exited with code $rc"
          fi

          exit "$rc"

      - name: Lint datapacks
        id: datapack-lint
        continue-on-error: true
        run: |
          set -uo pipefail

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          RESET='\033[0m'

          echo "::group::📦 Datapack Lint"
          trap 'echo "::endgroup::"' EXIT

          if [ ! -f ".github/workflows/lint.sh" ]; then
            printf "${RED}✘ .github/workflows/lint.sh is missing${RESET}\n"
            echo "::error file=.github/workflows/lint.sh,title=Missing lint script::The datapack lint script does not exist."
            exit 1
          fi

          bash .github/workflows/lint.sh
          rc=$?

          if [ "$rc" -eq 0 ]; then
            printf "${GREEN}✔ Datapack lint passed${RESET}\n"
          else
            printf "${RED}✘ Datapack lint failed with exit code %s${RESET}\n" "$rc"
            echo "::error title=Datapack lint failed::lint.sh exited with code $rc"
          fi

          exit "$rc"

      - name: Diagnostics
        if: always()
        run: |
          set +e

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          CYAN='\033[1;36m'
          RESET='\033[0m'

          echo "::group::🔎 Diagnostics"
          trap 'echo "::endgroup::"' EXIT

          build_result="${{ steps.build.outcome }}"
          gradle_lint_result="${{ steps.gradle-lint.outcome }}"
          datapack_lint_result="${{ steps.datapack-lint.outcome }}"

          printf "${CYAN}Build:${RESET} %s\n" "$build_result"
          printf "${CYAN}Gradle lint:${RESET} %s\n" "$gradle_lint_result"
          printf "${CYAN}Datapack lint:${RESET} %s\n" "$datapack_lint_result"

          echo "::group::Git status"
          git status --short
          echo "::endgroup::"

          echo "::group::Generated artifacts"
          find build mods examples \
            -type f \
            \( -name '*.jar' -o -name '*.zip' \) \
            -print 2>/dev/null | sort
          echo "::endgroup::"

          echo "::group::Build directories"
          find build -maxdepth 3 -type d -print 2>/dev/null | sort
          echo "::endgroup::"

          if [ "$build_result" != "success" ]; then
            printf "${RED}✘ Build diagnostics: FAILURE${RESET}\n"
          else
            printf "${GREEN}✔ Build diagnostics: OK${RESET}\n"
          fi

      # Decides whether anything may be published. Publishing is only
      # ever allowed from main, on push or manual runs, after a fully
      # green build + lint.
      - name: Release gate
        id: release-gate
        if: always()
        run: |
          set -euo pipefail

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          YELLOW='\033[1;33m'
          RESET='\033[0m'

          build_result="${{ steps.build.outcome }}"
          gradle_lint_result="${{ steps.gradle-lint.outcome }}"
          datapack_lint_result="${{ steps.datapack-lint.outcome }}"

          echo "::group::🚦 Release Gate"
          trap 'echo "::endgroup::"' EXIT

          printf "${YELLOW}Build:${RESET} %s\n" "$build_result"
          printf "${YELLOW}Gradle lint:${RESET} %s\n" "$gradle_lint_result"
          printf "${YELLOW}Datapack lint:${RESET} %s\n" "$datapack_lint_result"

          allowed=false
          if [ "$build_result" = "success" ] &&
             [ "$gradle_lint_result" = "success" ] &&
             [ "$datapack_lint_result" = "success" ]; then
            allowed=true
          fi

          publish=false
          if [ "$allowed" = "true" ] &&
             [ "$GITHUB_REF" = "refs/heads/main" ] &&
             { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
            publish=true
          fi

          echo "RELEASE_ALLOWED=$allowed" >> "$GITHUB_OUTPUT"
          echo "PUBLISH=$publish" >> "$GITHUB_OUTPUT"

          if [ "$allowed" = "true" ]; then
            printf "${GREEN}✔ Release gate PASSED${RESET}\n"
          else
            printf "${RED}✘ Release gate FAILED — nothing will be published.${RESET}\n"
            echo "::warning title=Release blocked::Build or lint failed; packs-latest will not be updated."
          fi

      - name: Build pack zips
        if: steps.release-gate.outputs.PUBLISH == 'true'
        run: |
          set -euo pipefail

          echo "::group::📦 Package Individual Packs"
          trap 'echo "::endgroup::"' EXIT

          ./gradlew zipPacks -PconfirmZip=yes

      - name: Build merged datapack
        if: steps.release-gate.outputs.PUBLISH == 'true'
        run: |
          set -euo pipefail

          echo "::group::🔀 Build Merged Datapack"
          trap 'echo "::endgroup::"' EXIT

          ./gradlew mergeDatapacks build

      - name: Collect release assets
        if: steps.release-gate.outputs.PUBLISH == 'true'
        run: |
          set -euo pipefail

          echo "::group::📤 Collect release assets"
          trap 'echo "::endgroup::"' EXIT

          mkdir -p release-assets
          shopt -s nullglob
          files=(build/packs-dist/*.zip build/dist/*.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No release assets::No zips were found in build/packs-dist or build/dist."
            exit 1
          fi

          cp -v "${files[@]}" release-assets/

      - name: Upload release assets
        if: steps.release-gate.outputs.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-packs
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Final summary
        if: always()
        run: |
          set +e

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          RESET='\033[0m'

          build_result="${{ steps.build.outcome }}"
          gradle_lint_result="${{ steps.gradle-lint.outcome }}"
          datapack_lint_result="${{ steps.datapack-lint.outcome }}"
          release_allowed="${{ steps.release-gate.outputs.RELEASE_ALLOWED }}"
          publish="${{ steps.release-gate.outputs.PUBLISH }}"

          echo "::group::📊 Final Summary"
          trap 'echo "::endgroup::"' EXIT

          show() {
            if [ "$2" = "success" ] || [ "$2" = "true" ]; then
              printf "${GREEN}✔ %s${RESET}\n" "$1"
            else
              printf "${RED}✘ %s${RESET}\n" "$1"
            fi
          }

          show "Build" "$build_result"
          show "Gradle lint" "$gradle_lint_result"
          show "Datapack lint" "$datapack_lint_result"
          show "Release gate" "$release_allowed"

          {
            echo "# 🏗️ Build / Lint"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Build | \`$build_result\` |"
            echo "| Gradle lint | \`$gradle_lint_result\` |"
            echo "| Datapack lint | \`$datapack_lint_result\` |"
            echo "| Release gate | \`$release_allowed\` |"
            echo "| Will publish | \`${publish:-false}\` |"
            echo ""
            echo "## Environment"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Runner | \`$RUNNER_OS\` |"
            echo "| Java | \`25\` |"
            echo "| Ref | \`$GITHUB_REF\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # build/lint steps use continue-on-error, so the job itself
          # would otherwise stay green. Fail it explicitly.
          if [ "$build_result" != "success" ] ||
             [ "$gradle_lint_result" != "success" ] ||
             [ "$datapack_lint_result" != "success" ]; then
            echo "::error title=Build/Lint failed::Build or lint did not succeed."
            exit 1
          fi

  # ==================================================================
  # RELEASE: only job with write access; runs no repository code
  # ==================================================================
  release:
    name: Release • packs-latest
    needs: build-lint
    if: needs.build-lint.outputs.publish == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: release-packs
          path: release-assets

      - name: Publish packs-latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: packs-latest
          name: Latest packs
          body: |
            MAINTENANCE PAUSED (not permanently archived). Since 2026-10-04 the maintainer is expected to be inactive until at least 2027-2028; no fixes or releases are planned and issues may go unanswered. All datapacks are archived reference copies (see archived/README.md); do not deploy them on a live server without review.

            Automatically updated on every push to main. Always reflects the current contents of packs/ and the merged datapack built from packs/merge-manifest.json.
          # FIX: added build/dist/*.zip so the merged datapack (produced by
          # mergeDatapacks in the step above) is published as a release
          # asset alongside the individual pack zips, not just the
          # per-pack files it published before.
          files: |
            build/packs-dist/*.zip
            build/dist/*.zip
          # FIX: was make_latest: false. This doesn't conflict with the intent
          # in the comment above ("keep download links permanently valid" via
          # moving the tag forward), but it does mean GitHub's "Latest
          # release" badge won't point at this release, so the repo's main
          # page may show a different (or no) release as "Latest". Changed to
          # true assuming that's not intentional; revert if another "real"
          # version release is meant to stay Latest instead.
          make_latest: true

      # Runs AFTER publishing so the release is never left empty, and
      # refuses to run if there is nothing current to compare against.
      - name: Remove stale pack assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "::group::🧹 Release Cleanup :: packs-latest"
          trap 'echo "::endgroup::"' EXIT

          current_files="$(find release-assets -maxdepth 1 -type f -name '*.zip' -printf '%f\n')"

          if [ -z "$current_files" ]; then
            echo "::error title=Cleanup aborted::No current assets known; refusing to delete anything."
            exit 1
          fi

          existing_assets="$(
            gh release view packs-latest \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )"

          while IFS= read -r asset; do
            [ -z "$asset" ] && continue

            if ! printf '%s\n' "$current_files" | grep -qxF -- "$asset"; then
              printf '\033[1;33mDeleting stale asset: %s\033[0m\n' "$asset"

              gh release delete-asset packs-latest "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done <<< "$existing_assets"
