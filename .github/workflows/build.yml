name: CI

on:
  push:
    branches: [main, master, devlop, test]
  pull_request:
  workflow_dispatch:

# Least privilege.
#
# The source-history archive is intentionally manual-only through the
# archive-history step condition below. It never needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI • ${{ matrix.os }} • Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    env:
      FORCE_COLOR: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout full repository
        uses: actions/checkout@v7
        with:
          # Required for the optional source-with-history archive.
          fetch-depth: 0
          # Do not leave the GITHUB_TOKEN inside .git; the archive step
          # copies .git wholesale into a downloadable artifact.
          persist-credentials: false

      # ================================================================
      # INSTALL
      # ================================================================

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ================================================================
      # ENVIRONMENT (after setup-python so it reports the matrix Python)
      # ================================================================

      - name: Show environment
        run: |
          set -euo pipefail

          echo "::group::🔧 Environment"
          trap 'echo "::endgroup::"' EXIT

          CYAN='\033[1;36m'
          RESET='\033[0m'

          printf "${CYAN}Runner:${RESET} %s\n" "$RUNNER_OS"
          printf "${CYAN}Python:${RESET} %s\n" "${{ matrix.python-version }}"
          printf "${CYAN}Repository:${RESET} %s\n" "$GITHUB_REPOSITORY"
          printf "${CYAN}Ref:${RESET} %s\n" "$GITHUB_REF"
          printf "${CYAN}Commit:${RESET} %s\n" "$GITHUB_SHA"

          python --version
          pip --version

      - name: Install guigenmc
        run: |
          set -euo pipefail

          echo "::group::📦 Install guigenmc"
          trap 'echo "::endgroup::"' EXIT

          pip install -e ./scripts/gui_generator

      # ================================================================
      # TEST CONFIGURATION
      # ================================================================

      - name: Write minimal config
        run: |
          set -euo pipefail

          echo "::group::📝 Create Test Configuration"
          trap 'echo "::endgroup::"' EXIT

          cat > menu.json << 'JSON'
          {
            "namespace": "demo",
            "menu_id": "shop",
            "pages": [
              {
                "index": 0,
                "name": "Main",
                "widgets": [
                  {
                    "kind": "button",
                    "slot": 13,
                    "item": "minecraft:diamond",
                    "name": {
                      "text": "Get Diamond",
                      "color": "aqua"
                    },
                    "commands": [
                      "give @s minecraft:diamond 1"
                    ]
                  },
                  {
                    "kind": "close",
                    "slot": 26
                  }
                ]
              }
            ]
          }
          JSON

          python -m json.tool menu.json >/dev/null

          printf '\033[1;32m✔ menu.json created and validated\033[0m\n'

      # ================================================================
      # GUI GENERATION
      # ================================================================

      - name: Generate datapack folder
        id: generate-folder
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::🎮 Generate Datapack Folder"
          trap 'echo "::endgroup::"' EXIT

          if ! guigenmc generate menu.json -f; then
            printf '\033[1;31m✘ Folder generation failed\033[0m\n'
            echo "::error title=Folder generation failed::guigenmc generate -f failed"
            exit 1
          fi

          test -f shop_datapack/pack.mcmeta
          test -f shop_datapack/data/demo/function/core/load.mcfunction

          printf '\033[1;32m✔ Datapack folder generated and checked\033[0m\n'

      # ================================================================
      # ZIP / VALIDATION / TREE
      # ================================================================

      - name: Generate zip and validate
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::📦 Generate ZIP + Validate + Tree"
          trap 'echo "::endgroup::"' EXIT

          if ! guigenmc generate menu.json -z -f -o shop.zip; then
            printf '\033[1;31m✘ ZIP generation failed\033[0m\n'
            echo "::error title=ZIP generation failed::guigenmc generate -z failed."
            exit 1
          fi

          test -s shop.zip

          if ! guigenmc validate menu.json; then
            printf '\033[1;31m✘ Validation failed\033[0m\n'
            echo "::error title=GUI validation failed::guigenmc validate failed."
            exit 1
          fi

          echo "::group::🌳 Generated Tree"
          guigenmc tree menu.json
          echo "::endgroup::"

          printf '\033[1;32m✔ ZIP generation and validation passed\033[0m\n'

      # ================================================================
      # STATIC UI
      # ================================================================

      - name: Verify UI static files
        id: static-ui
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::🖥️ UI Static Files"
          trap 'echo "::endgroup::"' EXIT

          static_file="$(
            python -c \
              "import guigenmc, pathlib; print(pathlib.Path(guigenmc.__file__).parent / 'static' / 'index.html')"
          )"

          echo "Expected: $static_file"

          if [ ! -f "$static_file" ]; then
            echo "::error title=Missing UI static file::static/index.html was not found."
            exit 1
          fi

          printf '\033[1;32m✔ UI static index.html exists\033[0m\n'

      # ================================================================
      # PACKAGE BUILD
      # ================================================================

      - name: Build sdist and wheel
        id: package
        continue-on-error: true
        working-directory: ./scripts/gui_generator
        run: |
          set -euo pipefail

          echo "::group::🐍 Python Package :: sdist + wheel"
          trap 'echo "::endgroup::"' EXIT

          pip install build twine

          python -m build
          python -m twine check dist/*

          # The editable install above always sees static/ in the source
          # tree; this checks that the built wheel actually ships it.
          python - << 'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("No wheel was built")
          names = zipfile.ZipFile(wheels[0]).namelist()
          if not any(n.endswith("static/index.html") for n in names):
              sys.exit("Wheel is missing static/index.html")
          PY

          printf '\033[1;32m✔ sdist/wheel build, twine check and wheel contents passed\033[0m\n'

      # ================================================================
      # NORMAL TEST ARTIFACT
      # ================================================================

      - name: Upload generated datapack
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datapack-${{ matrix.os }}-py${{ matrix.python-version }}
          path: shop.zip
          if-no-files-found: ignore
          retention-days: 3

      # ================================================================
      # SOURCE + GIT HISTORY ARCHIVE
      #
      # IMPORTANT:
      # This is deliberately restricted to manual workflow_dispatch runs
      # and ONE matrix combination. It is never automatically published
      # on push/pull_request.
      # ================================================================

      - name: Create source archive with Git history
        id: source-archive
        if: >
          github.event_name == 'workflow_dispatch' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        run: |
          set -euo pipefail

          echo "::group::📚 Source Archive :: full Git history"
          trap 'echo "::endgroup::"' EXIT

          YELLOW='\033[1;33m'
          GREEN='\033[1;32m'
          RESET='\033[0m'

          printf "${YELLOW}⚠ Creating an archive containing .git history.${RESET}\n"
          printf "${YELLOW}⚠ This may contain historical secrets that were removed later.${RESET}\n"

          mkdir -p archive

          rsync -a \
            --exclude=archive \
            --exclude=.github \
            --exclude=.git \
            ./ archive/

          cp -a .git archive/

          printf "${GREEN}✔ Source tree copied${RESET}\n"
          printf "${GREEN}✔ .git history copied${RESET}\n"

      - name: Create source ZIP
        id: source-zip
        if: >
          github.event_name == 'workflow_dispatch' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::🗜️ Source ZIP"
          trap 'echo "::endgroup::"' EXIT

          cd archive
          zip -qr ../source-with-history.zip .
          cd ..

          test -s source-with-history.zip

          printf '\033[1;32m✔ source-with-history.zip created\033[0m\n'
          ls -lh source-with-history.zip

      - name: Upload source archive
        if: >
          github.event_name == 'workflow_dispatch' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: source-code-with-history
          path: source-with-history.zip
          if-no-files-found: error
          retention-days: 3

      # ================================================================
      # DIAGNOSTICS
      # ================================================================

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          echo "::group::🔎 Diagnostics"
          trap 'echo "::endgroup::"' EXIT

          GREEN='\033[1;32m'
          RED='\033[1;31m'
          CYAN='\033[1;36m'
          RESET='\033[0m'

          generate_result="${{ steps.generate-folder.outcome }}"
          validate_result="${{ steps.validate.outcome }}"
          static_result="${{ steps.static-ui.outcome }}"
          package_result="${{ steps.package.outcome }}"

          printf "${CYAN}Folder generation:${RESET} %s\n" "$generate_result"
          printf "${CYAN}Validation:${RESET} %s\n" "$validate_result"
          printf "${CYAN}Static UI:${RESET} %s\n" "$static_result"
          printf "${CYAN}Package build:${RESET} %s\n" "$package_result"

          echo "::group::Generated files"
          find . \
            -maxdepth 4 \
            -type f \
            \( -name '*.zip' -o -name '*.whl' -o -name '*.tar.gz' \) \
            -print 2>/dev/null | sort
          echo "::endgroup::"

          echo "::group::Git status"
          git status --short
          echo "::endgroup::"

          if [ "$generate_result" = "success" ] &&
             [ "$validate_result" = "success" ] &&
             [ "$static_result" = "success" ] &&
             [ "$package_result" = "success" ]; then
            printf "${GREEN}✔ All CI checks passed${RESET}\n"
          else
            printf "${RED}✘ One or more CI checks failed${RESET}\n"
          fi

      # ================================================================
      # SUMMARY
      # ================================================================

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          set +e

          echo "::group::📊 CI Summary"
          trap 'echo "::endgroup::"' EXIT

          generate_result="${{ steps.generate-folder.outcome }}"
          validate_result="${{ steps.validate.outcome }}"
          static_result="${{ steps.static-ui.outcome }}"
          package_result="${{ steps.package.outcome }}"

          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          {
            echo "# 🧪 CI Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Datapack generation | $(icon "$generate_result") \`$generate_result\` |"
            echo "| ZIP + validation | $(icon "$validate_result") \`$validate_result\` |"
            echo "| UI static files | $(icon "$static_result") \`$static_result\` |"
            echo "| Python package | $(icon "$package_result") \`$package_result\` |"
            echo ""
            echo "## Environment"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| OS | \`${{ matrix.os }}\` |"
            echo "| Python | \`${{ matrix.python-version }}\` |"
            echo "| Ref | \`$GITHUB_REF\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo ""
            echo "## Artifacts"
            echo ""
            echo "- \`datapack-${{ matrix.os }}-py${{ matrix.python-version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$generate_result" != "success" ] ||
             [ "$validate_result" != "success" ] ||
             [ "$static_result" != "success" ] ||
             [ "$package_result" != "success" ]; then
            echo "::error title=CI failed::One or more CI checks failed."
            exit 1
          fi
