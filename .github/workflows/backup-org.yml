# .github/workflows/backup-org.yml
#
# Runs scripts/backup-org.sh on a GitHub-hosted runner and uploads the
# resulting archive as a workflow artifact. Entirely non-interactive - the
# script is the same one used locally, driven here through environment
# variables instead of prompts (see ARCHIVE_PASSWORD below).
#
# Required repo secrets:
#   ORG_READ_TOKEN        Fine-grained PAT or GitHub App token with read
#                          access to the org: repo contents, metadata,
#                          members, teams, security events (Dependabot /
#                          secret scanning), and Actions. Reused from the
#                          CODEOWNERS Sync workflow - the same token already
#                          has org-read access.
#   BACKUP_ARCHIVE_PASSWORD   Passphrase for the encrypted archive. Required
#                          whenever `encrypt` (below) is 7z or gpg; leave the
#                          secret unset only if you intend to always run this
#                          with encrypt=none.
#
# Optional repo/environment variable:
#   BACKUP_ORG             Organization to back up. Defaults to vortacraftmc
#                          (the script's own default) when unset.
#
# Manual-trigger only by default, same reasoning as CODEOWNERS Sync's
# maintenance pause: no unattended token use while the org is quiet. Uncomment
# the schedule block to back up automatically again.
name: Organization Backup

on:
  workflow_dispatch:
    inputs:
      encrypt:
        description: "Archive encryption"
        type: choice
        default: gpg
        options: [gpg, 7z, none]
      include_source:
        description: "Also include plain (non-bare) source checkouts"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 4 * * 1" # Weekly, Monday 04:00 UTC

permissions: {}

concurrency:
  # Never run two backups of the same org at once - github-backup isn't
  # designed for concurrent runs against one organization.
  group: backup-org
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      ORG: ${{ vars.BACKUP_ORG || 'vortacraftmc' }}
      ENCRYPT: ${{ inputs.encrypt || 'gpg' }}
      INCLUDE_SOURCE: ${{ (inputs.include_source && '1') || '0' }}
      JOBS: "2" # matches the standard ubuntu-latest runner's 2 vCPUs
      KEEP: "1" # the runner is thrown away after the run; no history to prune
      PIP_BREAK_SYSTEM: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      # The `runner` context (runner.temp) isn't available in a job-level
      # `env:` block, only in steps - so OUT_DIR/BACKUP_DIR are derived here
      # from $RUNNER_TEMP (the equivalent shell env var) and exported via
      # $GITHUB_ENV for every later step to see.
      - name: Set work directories
        run: |
          set -euo pipefail
          echo "OUT_DIR=$RUNNER_TEMP/backup-out" >> "$GITHUB_ENV"
          echo "BACKUP_DIR=$RUNNER_TEMP/backup-work" >> "$GITHUB_ENV"

      - name: Check required secrets
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ORG_READ_TOKEN secret is missing or empty."
            exit 1
          fi
          if [ "$ENCRYPT" != none ] && [ -z "${ARCHIVE_PASSWORD:-}" ]; then
            echo "::error::encrypt=$ENCRYPT needs the BACKUP_ARCHIVE_PASSWORD secret set."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ARCHIVE_PASSWORD: ${{ secrets.BACKUP_ARCHIVE_PASSWORD }}

      - name: Run backup
        run: bash scripts/backup-org.sh
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ARCHIVE_PASSWORD: ${{ secrets.BACKUP_ARCHIVE_PASSWORD }}

      # The checksum file travels INSIDE the artifact, so on its own it only
      # catches corruption, not tampering. Writing the hash to the run's job
      # summary stores it somewhere the artifact's contents cannot change.
      - name: Publish checksum to job summary
        run: |
          set -euo pipefail
          {
            echo "### Backup checksum (SHA-256)"
            echo
            echo '```'
            cat "$OUT_DIR"/*.sha256
            echo '```'
            echo
            echo "Encryption: \`$ENCRYPT\` | Include source: \`$INCLUDE_SOURCE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENCRYPT" = none ]; then
            echo "::warning::Archive is NOT encrypted (encrypt=none) and stays downloadable as an artifact for 14 days."
          fi

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ORG }}-backup-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/*.tar.gz
            ${{ env.OUT_DIR }}/*.tar.gz.gpg
            ${{ env.OUT_DIR }}/*.7z
            ${{ env.OUT_DIR }}/*.sha256
          # Keep for a while on the Actions side too, independent of KEEP
          # (which only prunes files inside a single, ephemeral runner).
          retention-days: 14
          if-no-files-found: error
