# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5

# MC 26.x ships unobfuscated (final names baked in; Yarn has no 26.x builds at
# all, 1.21.11 being the last obfuscated release). This tells Loom to skip
# mapping resolution entirely instead of trying to fetch
# net.fabricmc:yarn:26.3+build.X, which does not exist and would fail
# resolution. Unobfuscated-jar support landed in Loom 1.14, which also
# introduced the dedicated `net.fabricmc.fabric-loom` plugin id; this
# subproject still uses the legacy `fabric-loom` id plus this flag, which is
# the documented equivalent.
fabric.loom.disableObfuscation=true

# Fabric API
# NOTE: the Loom pin in build.gradle (1.15.5) is NOT shared with the rest of
# the monorepo, and an earlier revision of this comment claimed it "matches
# mods/datapack-blocker". It does not: datapack-blocker targets Minecraft
# 1.21.1, which is obfuscated and still resolves Yarn mappings, so the two
# subprojects share a version number by coincidence and nothing else. Loom
# 1.15.5 is also stale for this target - FabricMC recommends Loom 1.17 with
# Gradle 9.6+ for MC 26.3 (1.18 is the current release). Bumping the pin is
# tracked separately from this comment correction; do not read the number
# here as a repo-wide convention.
fabric_version=0.161.0+26.3

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=opmod
